    const over = ys.length ? ys[ys.length - 1] - (H - 12) : 0;
    if (over > 0) { ys[ys.length - 1] -= over; for (let i = ys.length - 2; i >= 0; i--) ys[i] = Math.min(ys[i], ys[i + 1] - minGap); }
    if (ys.length && ys[0] < 14) { const d = 14 - ys[0]; for (let i = 0; i < ys.length; i++) ys[i] += d; }
    const out = {}; items.forEach((it, i) => out[it.id] = ys[i]); return out;
  };
  const tLab = spread(targets, tPos, 32);
  const sLab = spread(sources, sPos, 34);
  return html`<div class="chart" ref=${ref}>
    <svg width=${W} height=${H} role="img" aria-label="Where this month's pay goes">
      ${bands.map((b, i) => html`<path class="sankey-band" d=${b.d} fill=${tColor(b.to)}
        opacity=${hover == null ? 0.34 : (hover === i ? 0.62 : 0.12)}
        onPointerMove=${e => { setHover(i); Tip.show(e, (sources.find(s => s.id === b.from) || {}).label + ' → ' + (targets.find(t => t.id === b.to) || {}).label, [{ value: money(b.value), color: tColor(b.to) }]); }}
        onPointerLeave=${() => { setHover(null); Tip.hide(); }} />`)}
      ${sources.map(s => html`<g>
        <rect x=${x0} y=${sPos[s.id].y} width=${nodeW} height=${sPos[s.id].h} rx="3" fill="var(--ink-2)" />
        <text x=${x0 - 8} y=${sLab[s.id] - 3} text-anchor="end" class="lbl-strong">${s.label}</text>
        <text x=${x0 - 8} y=${sLab[s.id] + 12} text-anchor="end" class="lbl-2">${money(s.value, { whole: true })}</text>
      </g>`)}
      ${targets.map(t => html`<g>
        <rect x=${x1} y=${tPos[t.id].y} width=${nodeW} height=${tPos[t.id].h} rx="3" fill=${t.color} />
        ${Math.abs(tLab[t.id] - (tPos[t.id].y + tPos[t.id].h / 2)) > 3 && html`<path d=${`M${x1 + nodeW + 1},${tPos[t.id].y + tPos[t.id].h / 2} L${x1 + nodeW + 5},${tLab[t.id] - 4}`} stroke="var(--axis)" fill="none" />`}
        <text x=${x1 + nodeW + 8} y=${tLab[t.id] - 2} class="lbl-strong">${narrow ? t.short || t.label : t.label}</text>
        <text x=${x1 + nodeW + 8} y=${tLab[t.id] + 13} class="lbl-2">${money(t.value, { whole: true })}</text>
      </g>`)}
    </svg>
  </div>`;
}

/* ---------- day-to-day pace: cumulative spend vs an even budget pace ---------- */
function PaceChart({ monthKey, cumulative, budget, todayDay }) {
  const ref = useRef(null);
  const W = useWidth(ref, 520);
  const H = 210, padL = 46, padR = 14, padT = 12, padB = 26;
  const dim = cumulative.length;
  const showTo = todayDay ? Math.min(todayDay, dim) : dim;
  const actual = cumulative.slice(0, showTo);
  const last = actual.length ? actual[actual.length - 1] : 0;
  const projected = todayDay && todayDay < dim && todayDay > 0 ? last / todayDay * dim : null;
  const maxV = Math.max(budget, last, projected || 0, 10);
  const tk = ticks(maxV);
  const top = tk[tk.length - 1];
  const x = d => padL + (d - 1) / Math.max(1, dim - 1) * (W - padL - padR);
  const y = v => padT + (1 - v / top) * (H - padT - padB);
  const path = actual.map((v, i) => `${i ? 'L' : 'M'}${x(i + 1)},${y(v)}`).join(' ');
  const area = actual.length ? `${path} L${x(actual.length)},${y(0)} L${x(1)},${y(0)} Z` : '';
  const [hd, setHd] = useState(null);
  const onMove = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = e.clientX - r.left;
    const d = Math.max(1, Math.min(dim, Math.round((px - padL) / (W - padL - padR) * (dim - 1)) + 1));
    setHd(d);
    const rows = [{ value: money(budget * d / dim), label: 'even pace', color: 'var(--quiet-mark)' }];
    if (d <= actual.length) rows.unshift({ value: money(actual[d - 1]), label: 'spent so far', color: 'var(--s1)' });
    Tip.show(e, dayLabel(monthKey + '-' + E.pad(d)), rows);
  };
  return html`<div class="chart" ref=${ref}>
    <svg width=${W} height=${H} role="img" aria-label="Day-to-day spending against an even pace">
      ${tk.map(v => html`<line class="gridline" x1=${padL} x2=${W - padR} y1=${y(v)} y2=${y(v)} />`)}
      ${tk.map(v => html`<text x=${padL - 8} y=${y(v) + 4} text-anchor="end" class="num">${shortMoney(v)}</text>`)}
      ${[1, 8, 15, 22, dim].map(d => html`<text x=${x(d)} y=${H - 6} text-anchor="middle">${d}</text>`)}
      <line x1=${x(1)} y1=${y(0)} x2=${x(dim)} y2=${y(budget)} stroke="var(--quiet-mark)" stroke-width="1.5" />
      ${area && html`<path d=${area} fill="var(--s1)" opacity="0.1" />`}
      ${path && html`<path d=${path} fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`}
      ${projected != null && html`<line x1=${x(actual.length)} y1=${y(last)} x2=${x(dim)} y2=${y(projected)} stroke="var(--s1)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />`}
      ${actual.length > 0 && html`<circle cx=${x(actual.length)} cy=${y(last)} r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" />`}
      ${hd && html`<line x1=${x(hd)} x2=${x(hd)} y1=${padT} y2=${H - padB} stroke="var(--ink-2)" stroke-width="1" opacity="0.5" />`}
      <rect x=${padL} y=${padT} width=${Math.max(0, W - padL - padR)} height=${H - padT - padB} fill="transparent" onPointerMove=${onMove} onPointerLeave=${() => { setHd(null); Tip.hide(); }} />
    </svg>
    <div class="legend"><span><i class="k-line" style=${{ background: 'var(--s1)' }}></i>Spent so far</span><span><i class="k-line" style=${{ background: 'var(--quiet-mark)' }}></i>Even pace to budget (${money(budget, { whole: true })})</span>${projected != null && html`<span class="muted">Dashed: where this pace ends the month (${money(projected, { whole: true })})</span>`}</div>
  </div>`;
}

/* ---------- progress ring ---------- */
function Ring({ value, max, size = 58, label, color }) {
  const r = (size - 8) / 2, c = 2 * Math.PI * r;
  const f = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
  return html`<svg class="ring" width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} role="img" aria-label=${label || pct(f)}>
    <circle class="track-c" cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke-width="7" />
    <circle class="val-c" cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke-width="7" stroke-linecap="round" style=${color ? { stroke: color } : null}
      stroke-dasharray=${c} stroke-dashoffset=${c * (1 - f)} transform=${`rotate(-90 ${size / 2} ${size / 2})`} />
    <text x=${size / 2} y=${size / 2 + 4.5} text-anchor="middle">${max > 0 ? Math.round(f * 100) + '%' : '·'}</text>
  </svg>`;
}

/* ---------- budget bars (HTML, nominal groups → one hue) ---------- */
function BudgetBars({ rows, onPick }) {
  const max = Math.max(1, ...rows.map(r => Math.max(r.budget, r.spent)));
  return html`<div class="bars">${rows.map(r => {
    const over = r.spent > r.budget + 0.005;
    const wSpent = Math.min(r.spent, r.budget) / max * 100;
    const wOver = over ? (r.spent - r.budget) / max * 100 : 0;
    return html`<div class="bar-row" style=${onPick ? { cursor: 'pointer' } : null} onClick=${onPick ? () => onPick(r) : null}
      onPointerMove=${e => Tip.show(e, r.name, [{ value: money(r.spent), label: 'spent', color: 'var(--s1)' }, { value: money(r.budget), label: 'budget', color: 'var(--ink-2)' }])} onPointerLeave=${() => Tip.hide()}>
      <div class="name">${r.name}${r.sub && html`<small>${r.sub}</small>`}</div>
      <div class="track" aria-hidden="true">
        <div class="fill" style=${{ width: wSpent + '%', borderRadius: over ? '0' : '0 4px 4px 0' }}></div>
        ${over && html`<div class="fill over" style=${{ left: wSpent + '%', width: wOver + '%' }}></div>`}
        ${r.budget > 0 && html`<div class="tick" style=${{ left: `calc(${r.budget / max * 100}% - 1px)` }}></div>`}
      </div>
      <div class="figs">${over ? html`<span class="chip crit"><${Icon} name="alert" size=${12} /> ${money(r.spent - r.budget)} over</span>` : html`<b>${money(r.spent, { auto: true })}</b> <span class="muted">of ${money(r.budget, { auto: true })}</span>`}</div>
    </div>`;
  })}</div>`;
}

/* ---------- goal timeline: when each pot is full ---------- */
function GoalTimeline({ proj, potsList, fromKey }) {
  const ref = useRef(null);
  const W = useWidth(ref, 720);
  // On a phone each goal gets two lines: its name, then its bar across the full width.
  const narrow = W < 560;
  const n = proj.keys.length;
  const rowH = narrow ? 46 : 30, padT = 26, padB = narrow ? 24 : 8;
  const H = padT + potsList.length * rowH + padB;
  const plotL = narrow ? 8 : 210, plotR = narrow ? 18 : 50;
  const x = i => plotL + i / Math.max(1, n - 1) * (W - plotL - plotR);
  const allYears = proj.keys.map((k, i) => ({ k, i })).filter(o => o.k.endsWith('-01'));
  const gapPx = allYears.length > 1 ? x(allYears[1].i) - x(allYears[0].i) : 999;
  const every = gapPx < 22 ? 3 : gapPx < 38 ? 2 : 1;
  const years = allYears.filter((o, j) => j % every === 0);
  const pStart = proj.pauseStart ? proj.keys.indexOf(proj.pauseStart) : -1;
  return html`<div class="chart" ref=${ref}>
    <svg width=${W} height=${H} role="img" aria-label="When each savings goal is reached">
      ${pStart >= 0 && html`<g><rect x=${x(pStart)} y=${padT - 6} width=${x(Math.min(n - 1, pStart + proj.pauseLen)) - x(pStart)} height=${H - padT - (narrow ? padB - 6 : 0)} fill="var(--warn-soft)" />
        <text x=${x(pStart) + 4} y=${narrow ? H - 6 : padT + 6} class="tiny" style=${{ fill: 'var(--warn-ink)', fontWeight: 700 }}>Maternity leave</text></g>`}
      ${years.map(o => html`<g><line class="gridline" x1=${x(o.i)} x2=${x(o.i)} y1=${padT - 6} y2=${H - (narrow ? padB : 0)} /><text x=${x(o.i)} y=${12} text-anchor="middle">${o.k.slice(0, 4)}</text></g>`)}
      ${potsList.map((p, r) => {
        const top = padT + r * rowH;
        const yy = narrow ? top + 31 : top + rowH / 2;
        const done = proj.doneAt[p.id];
        const di = done === 'done' ? 0 : done ? proj.keys.indexOf(done) : -1;
        const flip = di >= 0 && x(di) > W - 80;
        return html`<g onPointerMove=${e => Tip.show(e, p.name, [{ value: done === 'done' ? 'Reached' : done ? monthLabel(done) : 'After ' + monthLabel(proj.keys[n - 1]), label: done ? '' : 'at the current plan' }])} onPointerLeave=${() => Tip.hide()}>
          ${narrow ? html`<text x=${plotL - 4} y=${top + 14} class="lbl-strong" style=${{ paintOrder: 'stroke', stroke: 'var(--surface)', strokeWidth: '4px' }}>${p.name}</text>`
            : html`<text x=${plotL - 10} y=${yy + 4} text-anchor="end" class="lbl-2">${p.name}</text>`}
          <line x1=${x(0)} x2=${di >= 0 ? x(di) : x(n - 1)} y1=${yy} y2=${yy} stroke=${di >= 0 ? 'var(--s1)' : 'var(--quiet-mark)'} stroke-width="6" stroke-linecap="round" opacity=${di >= 0 ? 0.85 : 0.6} />
          ${di >= 0 && html`<path d=${`M${x(di)},${yy - 7} l7,7 l-7,7 l-7,-7z`} fill="var(--s1)" stroke="var(--surface)" stroke-width="2" />`}
          ${di >= 0 && html`<text x=${flip ? x(di) - 12 : x(di) + 12} y=${yy + 4} text-anchor=${flip ? 'end' : 'start'} class="lbl-2">${done === 'done' ? 'reached' : monthLabel(done, true)}</text>`}
          ${di < 0 && narrow && html`<text x=${x(n - 1)} y=${top + 14} text-anchor="end" class="lbl-2">beyond ${proj.keys[n - 1].slice(0, 4)}</text>`}
          <rect x=0 y=${top} width=${W} height=${rowH} fill="transparent" />
        </g>`;
      })}
    </svg>
  </div>`;
}

/* ---------- one series over time (area + line) ---------- */
function AreaChart({ keys, values, label, markIndex, height = 200 }) {
  const ref = useRef(null);
  const W = useWidth(ref, 640);
  const H = height, padL = 52, padR = 16, padT = 14, padB = 26;
  const maxV = Math.max(10, ...values);
  const tk = ticks(maxV);
  const top = tk[tk.length - 1];
  const x = i => padL + i / Math.max(1, values.length - 1) * (W - padL - padR);
  const y = v => padT + (1 - Math.max(0, v) / top) * (H - padT - padB);
  const path = values.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' ');
  const [hi, setHi] = useState(null);
  const onMove = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const i = Math.max(0, Math.min(values.length - 1, Math.round((e.clientX - r.left - padL) / (W - padL - padR) * (values.length - 1))));
    setHi(i);
    Tip.show(e, monthLabel(keys[i]), [{ value: money(values[i], { whole: true }), label, color: 'var(--s1)' }]);
  };
  const lastI = values.length - 1;
  return html`<div class="chart" ref=${ref}>
    <svg width=${W} height=${H} role="img" aria-label=${label + ' over time'}>
      ${tk.map(v => html`<line class="gridline" x1=${padL} x2=${W - padR} y1=${y(v)} y2=${y(v)} />`)}
      ${tk.map(v => html`<text x=${padL - 8} y=${y(v) + 4} text-anchor="end">${shortMoney(v)}</text>`)}
      ${keys.map((k, i) => k.endsWith('-01') ? html`<text x=${x(i)} y=${H - 6} text-anchor="middle">${k.slice(0, 4)}</text>` : null)}
      <path d=${`${path} L${x(lastI)},${y(0)} L${x(0)},${y(0)} Z`} fill="var(--s1)" opacity="0.1" />
      <path d=${path} fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" />
      <circle cx=${x(lastI)} cy=${y(values[lastI])} r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" />
      <text x=${x(lastI) - 6} y=${y(values[lastI]) - 10} text-anchor="end" class="lbl-strong">${money(values[lastI], { whole: true })}</text>
      ${markIndex != null && markIndex >= 0 && html`<line x1=${x(markIndex)} x2=${x(markIndex)} y1=${padT} y2=${H - padB} stroke="var(--ink-2)" opacity="0.4" />`}
      ${hi != null && html`<circle cx=${x(hi)} cy=${y(values[hi])} r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" />`}
      <rect x=${padL} y=${padT} width=${Math.max(0, W - padL - padR)} height=${H - padT - padB} fill="transparent" onPointerMove=${onMove} onPointerLeave=${() => { setHi(null); Tip.hide(); }} />
    </svg>
  </div>`;
}

/* ---------- under / over budget by area (diverging) ---------- */
function DivergingBars({ rows }) {
  const max = Math.max(1, ...rows.map(r => Math.abs(r.value)));
  return html`<div class="bars">${rows.map(r => {
    const w = Math.abs(r.value) / max * 50;
    const under = r.value >= 0;
    return html`<div class="bar-row" onPointerMove=${e => Tip.show(e, r.name, [{ value: money(Math.abs(r.value)), label: under ? 'under budget' : 'over budget', color: under ? 'var(--s1)' : 'var(--s8)' }])} onPointerLeave=${() => Tip.hide()}>
      <div class="name">${r.name}</div>
      <div class="track" style=${{ background: 'none' }} aria-hidden="true">
        <div style=${{ position: 'absolute', left: '50%', top: '-3px', bottom: '-3px', width: '1px', background: 'var(--axis)' }}></div>
        <div style=${{ position: 'absolute', top: 0, bottom: 0, left: under ? '50%' : `calc(50% - ${w}%)`, width: w + '%', background: under ? 'var(--s1)' : 'var(--s8)', borderRadius: under ? '0 4px 4px 0' : '4px 0 0 4px' }}></div>
      </div>
      <div class="figs">${under ? html`<span>${money(r.value)} <span class="muted">under</span></span>` : html`<span class="chip crit"><${Icon} name="alert" size=${12} />${money(-r.value)} over</span>`}</div>
    </div>`;
  })}</div>`;
}

/* ---------- months side by side: spent vs saved ---------- */
function TrendBars({ rows }) {
  const ref = useRef(null);
  const W = useWidth(ref, 640);
  const H = 210, padL = 48, padR = 10, padT = 12, padB = 26;
  const maxV = Math.max(10, ...rows.map(r => Math.max(r.spent, r.saved)));
  const tk = ticks(maxV); const top = tk[tk.length - 1];
  const band = (W - padL - padR) / Math.max(1, rows.length);
  const bw = Math.min(22, band / 3);
  const y = v => padT + (1 - v / top) * (H - padT - padB);
  return html`<div class="chart" ref=${ref}>
    <svg width=${W} height=${H} role="img" aria-label="Spent and saved by month">
      ${tk.map(v => html`<line class="gridline" x1=${padL} x2=${W - padR} y1=${y(v)} y2=${y(v)} />`)}
      ${tk.map(v => html`<text x=${padL - 8} y=${y(v) + 4} text-anchor="end">${shortMoney(v)}</text>`)}
      ${rows.map((r, i) => {
        const cx = padL + band * i + band / 2;
        const bar = (v, dx, color, lab) => { const h = Math.max(0, y(0) - y(v)); return html`<path d=${`M${cx + dx},${y(0)} v${-Math.max(0, h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(0, h - 4)} z`} fill=${color}
          onPointerMove=${e => Tip.show(e, monthLabel(r.key), [{ value: money(v), label: lab, color }])} onPointerLeave=${() => Tip.hide()} />`; };
        return html`<g>${bar(r.spent, -bw - 1, 'var(--s1)', 'spent')}${bar(r.saved, 1, 'var(--s3)', 'saved')}<text x=${cx} y=${H - 6} text-anchor="middle">${monthLabel(r.key, true).slice(0, 3)}</text></g>`;
      })}
    </svg>
    <div class="legend"><span><i class="k-box" style=${{ background: 'var(--s1)' }}></i>Spent</span><span><i class="k-box" style=${{ background: 'var(--s3)' }}></i>Saved into pots</span></div>
  </div>`;
}

/* ===== UI part 1: shared widgets, shell, overview, payday ===== */

/* ---------- small widgets ---------- */
function EditMoney({ value, onCommit, overridden, title, allowEmpty, placeholder, cls: extra }) {
  const [edit, setEdit] = useState(false);
  const [v, setV] = useState('');
  const ref = useRef(null);
  const closed = useRef(false);
  useEffect(() => { if (edit && ref.current) { ref.current.focus(); ref.current.select(); } }, [edit]);
  if (!edit) {
    return html`<button type="button" class=${cls('editable amt', overridden && 'overridden', extra)} title=${title || 'Change amount'}
      onClick=${() => { closed.current = false; setV(value == null ? '' : String(E.r2(value))); setEdit(true); }}>${value == null ? html`<span class="muted">${placeholder || 'Add'}</span>` : money(value)}</button>`;
  }
  const finish = commit => {
    if (closed.current) return; closed.current = true; setEdit(false);
    if (!commit) return;
    if (v.trim() === '') { if (allowEmpty && value != null) onCommit(null); return; }
    const n = parseMoney(v);
    if (n == null) { toast('Type an amount like 12.50'); return; }
    if (value == null || Math.abs(n - value) > 0.004) onCommit(n);
  };
  return html`<input ref=${ref} class="inline" inputmode="decimal" value=${v} aria-label=${title || 'Amount'}
    onInput=${e => setV(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); }} onBlur=${() => finish(true)} />`;
}
function EditText({ value, onCommit, placeholder, title, strong }) {
  const [edit, setEdit] = useState(false);
  const [v, setV] = useState('');
  const ref = useRef(null);
  const closed = useRef(false);
  useEffect(() => { if (edit && ref.current) { ref.current.focus(); ref.current.select(); } }, [edit]);
  if (!edit) return html`<button type="button" class=${cls('editable', strong && 'strong')} style=${{ textAlign: 'left' }} title=${title || 'Edit'} onClick=${() => { closed.current = false; setV(value || ''); setEdit(true); }}>${value || html`<span class="muted">${placeholder || 'Add'}</span>`}</button>`;
  const finish = commit => { if (closed.current) return; closed.current = true; setEdit(false); if (commit && v.trim() !== (value || '')) onCommit(v.trim()); };
  return html`<input ref=${ref} class="inline wide" value=${v} aria-label=${title || 'Text'} onInput=${e => setV(e.target.value)}
    onKeyDown=${e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); }} onBlur=${() => finish(true)} />`;
}
function Check({ checked, onToggle, label, disabled }) {
  return html`<button type="button" class="check" role="checkbox" aria-checked=${checked ? 'true' : 'false'} aria-label=${label} disabled=${disabled}
    onClick=${disabled ? null : onToggle} style=${disabled ? { cursor: 'default' } : null}>${checked && html`<${Icon} name="check" size=${14} />`}</button>`;
}
function Panel({ title, sub, actions, children, cls: extra, id }) {
  return html`<section class=${cls('panel', extra)} id=${id}>
    ${(title || actions) && html`<div class="panel-head"><div>${title && html`<h2>${title}</h2>`}${sub && html`<p>${sub}</p>`}</div>${actions && html`<div class="row">${actions}</div>`}</div>`}
    ${children}
  </section>`;
}
function Seg({ value, options, onChange, label }) {
  return html`<div class="seg" role="group" aria-label=${label}>${options.map(o => html`<button type="button" aria-pressed=${String(value === o.value)} onClick=${() => onChange(o.value)}>${o.label}</button>`)}</div>`;
}
function Modal({ title, onClose, wide, children, foot }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);
  return html`<div class="overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class=${cls('modal', wide && 'wide')} role="dialog" aria-modal="true" aria-label=${title}>
      <div class="modal-head"><h2>${title}</h2><button class="iconbtn" aria-label="Close" onClick=${onClose}><${Icon} name="x" /></button></div>
      ${children}
      ${foot && html`<div class="modal-foot">${foot}</div>`}
    </div>
  </div>`;
}
function openModal(type, props) { S.modal = { type, props: props || {} }; emit(); }
function closeModal() { S.modal = null; emit(); }

/* category options, including pots, debts and transfers */
function categoryOptions(plan, opts = {}) {
  const groups = [];
  const cats = E.categories(plan);
  const gnames = [];
  cats.forEach(c => { const g = c.group || 'Other'; if (!gnames.includes(g)) gnames.push(g); });
  const order = plan.groups || [];
  gnames.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  gnames.forEach(g => groups.push({ label: g, items: cats.filter(c => (c.group || 'Other') === g).map(c => ({ value: c.id, label: c.name })) }));
  const ps = E.pots(plan);
  groups.push({ label: 'Into a savings pot', items: ps.map(p => ({ value: 'pot:' + p.id + ':in', label: 'Into ' + p.name })) });
  groups.push({ label: 'Paid from a savings pot', items: ps.map(p => ({ value: 'pot:' + p.id + ':out', label: 'From ' + p.name })) });
  const ds = E.debts(plan);
  if (ds.length) groups.push({ label: 'Paying off debt', items: ds.map(d => ({ value: 'debt:' + d.id, label: 'Repay ' + d.name })) });
  const xfers = E.pools(plan).map(p => ({ value: 'xfer:' + p.id, label: 'Transfer to ' + (p.id === 'joint' ? 'joint account' : poolShort(p).toLowerCase()) }));
  groups.push({ label: 'Not spending', items: [...xfers, { value: 'xfer:own', label: 'Move between own accounts' }, { value: 'income', label: 'Money in / refund' }] });
  return groups;
}
function categoryName(plan, id) {
  if (!id) return 'Uncategorised';
  const p = E.parseCat(id);
  if (p.type === 'cat') return (plan.categories && plan.categories[id] && plan.categories[id].name) || 'Unknown category';
  if (p.type === 'potIn') return 'Into ' + ((plan.pots[p.pot] || {}).name || 'pot');
  if (p.type === 'potOut') return 'From ' + ((plan.pots[p.pot] || {}).name || 'pot');
  if (p.type === 'debt') return 'Repay ' + ((plan.debts[p.debt] || {}).name || 'debt');
  if (id === 'xfer:own') return 'Between own accounts';
  if (p.type === 'xferJoint') { const pl = E.poolMap(plan)[p.pool]; return 'Transfer to ' + (!pl || pl.id === 'joint' ? 'joint account' : poolShort(pl).toLowerCase()); }
  if (id === 'income') return 'Money in / refund';
  return id;
}
function CatSelect({ value, onChange, id, label, emptyLabel }) {

  return html`<select class="field" id=${id} aria-label=${label || 'Category'} value=${value || ''} onChange=${e => onChange(e.target.value)}>

    ${groups.map(g => html`<optgroup label=${g.label}>${g.items.map(i => html`<option value=${i.value}>${i.label}</option>`)}</optgroup>`)}

}

/* ---------- attention list (used by overview and nav badges) ---------- */
function attentionItems(M) {
  const out = [];
  const key = M.key, td = todayStr();
  for (const mem of M.members) {
    const r = M.res[mem.id];
    const open = r.lines.filter(l => l.transfer && l.left > 0.005 && !(l.kind === 'buffer' && !l.pot));
    if (open.length) {
      const due = E.transferDate(mem, key);
      const amt = E.sum(open, l => l.left);
      out.push({ id: 'xfer-' + mem.id, tone: due < td && key <= thisMonth() ? 'warn' : 'info', text: `${memberName(mem.id, { you: true })}: ${money(amt)} to move across ${open.length} transfer${open.length > 1 ? 's' : ''}`, sub: (due < td ? 'Due since ' : 'Due ') + dayLabel(due), go: 'payday' });
    }
    if (r.short > 0.005) out.push({ id: 'short-' + mem.id, tone: 'crit', text: `${memberName(mem.id, { you: true })} is ${money(r.short)} short this month`, sub: 'Lower some lines on Payday', go: 'payday' });
  }
  for (const pv of (M.pools || [])) if (pv.deficit > 0.005) out.push({ id: 'pool-' + pv.id, tone: 'crit', text: `${poolShort(pv)} is ${money(pv.deficit)} short`, sub: 'Nobody is covering part of it this month', go: 'payday' });
  if (M.uncategorised.length) out.push({ id: 'uncat', tone: 'warn', text: `${M.uncategorised.length} transaction${M.uncategorised.length > 1 ? 's need' : ' needs'} a category`, go: 'spending' });
  const noAcc = M.txns.filter(t => !t.account && t.category !== 'income');
  if (noAcc.length) out.push({ id: 'noacc', tone: 'info', text: `${noAcc.length} transaction${noAcc.length > 1 ? 's have' : ' has'} no card or account set`, sub: noAcc[0].desc, go: 'spending' });
  for (const c of M.totals.overspent) out.push({ id: 'over-' + c.id, tone: 'crit', text: `${c.name} is ${money(c.spent - c.budget)} over budget`, sub: 'Cover it from another budget', go: 'spending' });
  const unlogged = M.cats.filter(c => c.kind === 'bill' && c.budget > 0 && c.count === 0);
  if (unlogged.length && key <= thisMonth()) out.push({ id: 'bills', tone: 'info', text: `${unlogged.length} regular bill${unlogged.length > 1 ? 's' : ''} not logged yet`, sub: 'Log them in one go on Spending', go: 'spending' });
  const L = M.ledger;
  for (const d of E.debts(S.plan)) {
    const b = L.debtEnd[d.id];
    if (b == null) out.push({ id: 'debt-' + d.id, tone: 'info', text: `Add the balance left on “${d.name}”`, go: 'pots' });
    else if (b > 0.005 && d.payInFull) out.push({ id: 'debt-' + d.id, tone: 'warn', text: `Clear ${money(b)} on the ${d.name} in full`, sub: 'Pay the whole statement balance so no interest is charged', go: 'pots' });
  }
  return out;
}

/* ---------- overview ---------- */
function Overview() {
  const M = model();
  const key = M.key, now = thisMonth(), td = todayStr();
  const dim = E.daysInMonth(key);
  const todayDay = key === now ? +td.slice(8, 10) : (key < now ? dim : 0);
  const daysLeft = key === now ? dim - todayDay + 1 : (key > now ? dim : 0);
  const flex = M.cats.filter(c => c.kind === 'discretionary' || c.kind === 'living');
  const left = E.sum(flex, c => Math.max(0, c.left));
  const flexBudget = E.sum(flex, c => c.budget);
  const flexSet = new Set(flex.map(c => c.id));
  const daily = Array.from({ length: dim }, () => 0);
  M.txns.forEach(t => { if (flexSet.has(t.category) && E.monthOf(t.date) === key) { const d = +String(t.date).slice(8, 10); if (d >= 1 && d <= dim) daily[d - 1] += +t.amount || 0; } });
  let run = 0; const cum = daily.map(v => (run = E.r2(run + v)));
  const T = M.totals;
  const nextPay = M.members.map(m => M.res[m.id]).filter(r => !r.received).sort((a, b) => String(a.payDate).localeCompare(String(b.payDate)))[0];
  const amexDebt = E.debts(S.plan).find(d => d.payInFull);
  const amexBal = amexDebt ? M.ledger.debtEnd[amexDebt.id] : null;
  // sankey data

  const tg = {};

    M.res[m.id].lines.forEach(l => { if (l.final > 0.004) { const k = l.group === 'joint' ? 'pool:' + (l.pool || 'joint') : l.group; per[k] = (per[k] || 0) + l.final; } });
    Object.entries(per).forEach(([g, v]) => { links.push({ from: m.id, to: g, value: E.r2(v) }); tg[g] = (tg[g] || 0) + v; });

  });
  const att = attentionItems(M);

  const P = projection();
  return html`<div class="page">

      <//>

        </div>

    <${Panel} title="Savings pots" sub="Balance against each goal. The ring fills as the pot fills." actions=${html`<button class="btn sm ghost" onClick=${() => go('pots')}>All pots <${Icon} name="arrow" size=${14} /></button>`}>
      <div class="pots">${potsShown.map(p => {

        const done = P.doneAt[p.id];
        return html`<div class="row" style=${{ flexWrap: 'nowrap' }}><${Ring} value=${bal} max=${target} size=${52} />

          <div class="small ink2">${money(bal, { auto: true })}${target > 0 ? html` <span class="muted">of ${money(target, { whole: true })}</span>` : html` <span class="muted">${p.sinking ? (bal < 0 ? '· paid ahead for a trip' : '· trip fund') : ''}</span>`}</div>
          <div class="tiny muted">${done === 'done' ? 'Goal reached' : done ? 'Full by ' + monthLabel(done, true) : target > 0 ? 'Beyond 6 years at this rate' : ''}</div></div></div>`;
      })}</div>
    <//>

    <${ChecklistPanel} compact=${true} />
  </div>`;
}

/* ---------- checklist ---------- */
function ChecklistPanel({ compact, group, embedded }) {
  const items = E.live(S.checklist && S.checklist.items).sort(E.byOrder).filter(i => !group || i.group === group);
  const [showAll, setShowAll] = useState(!compact);
  const [newText, setNewText] = useState('');
  if (!S.checklist) return null;
  const done = items.filter(i => i.done).length;
  const groups = [];
  items.forEach(i => { if (!groups.includes(i.group || 'To do')) groups.push(i.group || 'To do'); });
  const visible = showAll ? items : items.filter(i => !i.done).slice(0, 5);
  const toggle = i => API.checklist({ items: { [i.id]: { done: !i.done, doneAt: !i.done ? todayStr() : null } } });
  const add = () => { const t = newText.trim(); if (!t) return; const id = uid('k'); API.checklist({ items: { [id]: { text: t, group: group || 'My list', order: 100 + items.length } } }); setNewText(''); };
  return html`<${Panel} cls=${embedded ? 'embedded' : ''} title=${group || 'Getting set up'} sub=${`${done} of ${items.length} done`} actions=${compact && html`<button class="btn sm ghost" onClick=${() => setShowAll(!showAll)}>${showAll ? 'Show fewer' : 'Show all'}</button>`}>
    <div class="meter" style=${{ marginTop: 0, marginBottom: '10px' }}><i style=${{ width: pct(items.length ? done / items.length : 0) }}></i></div>
    <div class="list tasklist">
      ${(showAll && !group ? groups : [null]).map(g => html`${g && html`<div class="eyebrow" style=${{ padding: '12px 0 2px' }}>${g}</div>`}
        ${visible.filter(i => !g || (i.group || 'To do') === g).map(i => html`<div class="li"><${Check} checked=${!!i.done} onToggle=${() => toggle(i)} label=${i.text} />
          <div class="grow ${i.done ? 'done-txt' : ''}">${i.text}</div>
          <button class="iconbtn" aria-label="Remove" onClick=${() => API.checklist({ items: { [i.id]: { deleted: true } } })}><${Icon} name="x" size=${14} /></button></div>`)}`)}
    </div>
    ${showAll && html`<div class="row" style=${{ marginTop: '10px', flexWrap: 'nowrap' }}><input class="field" id=${'newtask-' + (group || 'all')} placeholder="Add a to-do" value=${newText} onInput=${e => setNewText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') add(); }} /><button class="btn" onClick=${add}>Add</button></div>`}
  <//>`;
}

/* ---------- payday ---------- */
function Payday() {
  const M = model();
  return html`<div class="page">
    <${Banners} />
    <${PaydayTimeline} M=${M} />
    <div class="payday-cols">${M.members.map(m => html`<${PersonPayday} M=${M} mem=${m} />`)}</div>
    ${(M.pools || []).filter(pv => pv.need > 0.004 || pv.lines.some(l => l.final > 0.004 || l.covered > 0.004)).map(pv => html`<${PoolPanel} M=${M} pv=${pv} />`)}
  </div>`;
}
function PaydayTimeline({ M }) {
  const key = M.key, dim = E.daysInMonth(key);
  const marks = [];
  M.members.forEach(m => {
    const pd = M.res[m.id].payDate;
    if (pd && E.monthOf(pd) === key) marks.push({ day: +pd.slice(8, 10), label: `${possessive(m.id)} payday`, color: memberColor(m.id) });
    else if (pd) marks.push({ day: 1, label: `${possessive(m.id)} pay for ${MONTHS[+key.slice(5) - 1]}`, sub: 'arrived ' + dayLabel(pd), color: memberColor(m.id), early: true });
    const td = E.transferDate(m, key);
    marks.push({ day: +td.slice(8, 10), label: `${possessive(m.id)} transfers`, color: 'var(--surface)', ring: memberColor(m.id) });
    const nextPd = E.paydayFor(m, E.addMonths(key, 1));
    if (nextPd && E.monthOf(nextPd) === key) marks.push({ day: +nextPd.slice(8, 10), label: `${possessive(m.id)} pay for ${MONTHS[+E.addMonths(key, 1).slice(5) - 1]}`, color: memberColor(m.id), dim: true });
  });
  marks.sort((a, b) => a.day - b.day || (a.early ? -1 : 0));
  marks.forEach((mk, i) => { mk.up = i % 2 === 1; });
  const td = todayStr();
  const nowKey = E.monthOf(td);
  const todayDay = nowKey === key ? +td.slice(8, 10) : null;
  const isPast = mk => key < nowKey || mk.early || (todayDay != null && mk.day < todayDay);
  const pos = d => ((d - 1) / Math.max(1, dim - 1) * 100);
  const ref = useRef(null);
  const W = useWidth(ref, 720);
  const narrow = W < 600;
  // On a phone the marks become a short agenda, with today slotted in where it falls.
  const agenda = () => {
    const rows = marks.map(mk => ({ mk, day: mk.day }));
    if (todayDay != null) rows.push({ today: true, day: todayDay + 0.5 });
    rows.sort((a, b) => a.day - b.day);
    return html`<div class="agenda">${rows.map(r => r.today
      ? html`<div class="ag-row today"><i class="ag-dot"></i><div>Today</div><span class="small">${dayLabel(td)}</span></div>`
      : html`<div class=${cls('ag-row', isPast(r.mk) && 'past')}>
          <i class="ag-dot" style=${{ background: r.mk.color, boxShadow: r.mk.ring ? `0 0 0 2px ${r.mk.ring}` : null }}></i>
          <div class="lname">${r.mk.label}</div><span class="small muted">${r.mk.sub || dayLabel(key + '-' + E.pad(r.mk.day))}</span></div>`)}</div>`;
  };
  return html`<${Panel} title=${`${monthLabel(key)} at a glance`} sub="Paydays, transfer days and today. Each person's pay funds the month shown.">
    <div ref=${ref}>
    ${narrow ? agenda() : html`<div class="timeline" style=${{ height: '84px', marginTop: '18px' }}>
      <div class="tl-axis" style=${{ top: '40px' }}></div>
      ${todayDay && html`<div class="tl-today" style=${{ left: `calc(${pos(todayDay)}% - 1px)`, top: '31px', height: '20px' }} title="Today"></div>`}
      ${marks.map(mk => html`<div class=${cls('tl-mark', mk.up && 'up')} style=${{ left: `clamp(60px, ${pos(mk.day)}%, calc(100% - 60px))`, top: mk.up ? '-4px' : '32px', opacity: mk.dim ? 0.7 : 1 }}>
        <i style=${{ background: mk.color, boxShadow: mk.ring ? `0 0 0 2px ${mk.ring}` : null }}></i><span>${mk.label}<br/><span class="muted">${mk.sub || dayLabel(key + '-' + E.pad(mk.day))}</span></span></div>`)}
    </div>`}
    </div>
  <//>`;
}
function PersonPayday({ M, mem }) {
  const key = M.key;
  const r = M.res[mem.id];
  const pay = (M.month.pay || {})[mem.id] || {};
  const [adding, setAdding] = useState(false);
  const setPay = patch => API.month(key, { pay: { [mem.id]: patch } });
  const groups = E.GROUPS.map(g => ({ g, lines: r.lines.filter(l => l.group === g && (l.final > 0.004 || l.amount > 0.004 || l.covered > 0.004 || l.overridden || l.extra)) })).filter(x => x.lines.length);
  const transferDay = E.transferDate(mem, key);
  const cuts = r.lines.filter(l => l.cut > 0.004);
  const copyText = () => {
    const lines = r.lines.filter(l => l.transfer && l.final > 0.004 && (l.kind !== 'buffer' || l.pot)).map(l => `${money(l.final)}  ${l.label}`);
    const text = `${memberName(mem.id)} – transfers on ${dayLabel(transferDay)}\n` + lines.join('\n');
    try { navigator.clipboard.writeText(text).then(() => toast('Copied the transfer list'), () => openModal('text', { title: 'Transfer list', text })); } catch (e) { openModal('text', { title: 'Transfer list', text }); }
  };
  return html`<section class="panel">
    <div class="person-head"><${Avatar} id=${mem.id} />
      <div style=${{ flex: 1, minWidth: 0 }}><h2>${memberName(mem.id)}${S.me === mem.id ? html` <span class="chip accent">You</span>` : ''}</h2>
      <div class="small muted">Pay for ${monthLabel(key)} · transfers on ${dayLabel(transferDay)}</div></div>
      <button class="iconbtn" title="Copy the transfer list" aria-label="Copy the transfer list" onClick=${copyText}><${Icon} name="copy" /></button>
    </div>
    <div class="pay-input">
      <label class="lab" for=${'pay-' + mem.id}>Take-home pay${r.received ? '' : html` <span class="hint">expected ${dayLabel(r.payDate)}, planned ${money(mem.plannedPay)}</span>`}
        <div class="money-in"><span>£</span><input class="field" id=${'pay-' + mem.id} inputmode="decimal" placeholder=${String(mem.plannedPay || '')}
          value=${pay.amount != null ? pay.amount : ''} onChange=${e => { const v = e.target.value.trim(); setPay({ amount: v === '' ? null : parseMoney(v), date: pay.date || (v ? todayStr() : null) }); }} /></div>
      </label>
      <div class="stack pay-side">
        ${r.received ? html`<span class="chip good"><${Icon} name="check" size=${12} /> Received ${dayLabel(r.payDate)}</span>` : html`<button class="btn sm" onClick=${() => setPay({ amount: mem.plannedPay, date: r.payDate })}>It arrived as planned</button>`}
        ${pay.note && html`<span class="tiny muted pay-note">${pay.note}</span>`}
      </div>
    </div>
    ${r.short > 0.005 && html`<div class="banner crit"><${Icon} name="alert" /><div class="grow">This pay is <b>${money(r.short)}</b> short of the bills and transfers below. Lower a line or add money from a pot.</div></div>`}
    ${cuts.length > 0 && html`<div class="banner warn"><${Icon} name="alert" /><div class="grow">Pay is lower than planned, so these transfers were reduced, lowest priority first: ${cuts.map((l, i) => html`${i ? ', ' : ''}<b>${l.label}</b> −${money(l.cut)}`)}.</div></div>`}
    ${groups.map(({ g, lines }) => html`<div class="line-group"><h4><span class="swatch" style=${{ background: GROUP_META[g].color }}></span>${GROUP_META[g].label}</h4>
      ${lines.map(l => html`<${LineRow} key=${l.id} M=${M} mem=${mem} l=${l} />`)}</div>`)}
    <div class="hr" style=${{ margin: '14px 0 10px' }}></div>
    <div class="row small"><span class="muted">Planned out</span><b class="num">${money(r.allocated)}</b><span class="muted">· Pay</span><b class="num">${money(r.income)}</b><span class="spacer"></span>
      ${r.toMove > 0.005 ? html`<span class="chip warn">${money(r.toMove)} still to move</span>` : html`<span class="chip good"><${Icon} name="check" size=${12} /> Transfers done</span>`}</div>
    <div class="row" style=${{ marginTop: '12px' }}>
      ${adding ? html`<${AddLineForm} mem=${mem} monthKey=${key} onDone=${() => setAdding(false)} />` : html`<button class="btn sm ghost" onClick=${() => setAdding(true)} disabled=${S.readOnly}><${Icon} name="plus" size=${14} />Add a one-off for this month</button>`}
    </div>
  </section>`;
}
function LineRow({ M, mem, l }) {
  const key = M.key;
  const pm = S.plan.pots || {};
  const ticked = !!(l.tick && l.tick.done);
  const canTick = l.transfer && (l.kind !== 'buffer' || l.pot) && l.final > 0.004;
  const autoDone = l.done && !ticked;
  const tkKey = mem.id + ':' + l.id;
  const toggle = () => {
    if (ticked) API.month(key, { ticks: { [tkKey]: { done: false } } });
    else API.month(key, { ticks: { [tkKey]: { done: true, amount: E.r2(Math.max(0, l.left)), coveredAt: E.r2(l.covered || 0), pot: l.pot || null, debt: l.debt || null, at: todayStr(), by: S.viewerId || S.me || null } } }).then(ok => {
      if (ok && l.pot) toast(`Marked ${money(Math.max(0, l.left))} into ${(pm[l.pot] || {}).name || 'the pot'} as done`, { label: 'Undo', fn: () => API.month(key, { ticks: { [tkKey]: { done: false } } }) });
    });
  };
  const setAmount = v => {
    if (l.kind === 'own' || l.kind === 'support') return API.month(key, { catBudgets: { [l.category]: v } });
    if (l.extra) return API.month(key, { extra: { [l.id]: { amount: v } } });
    return API.month(key, { lines: { [l.id]: { amount: v } } });
  };
  const reset = () => {
    if (l.kind === 'own' || l.kind === 'support') return API.month(key, { catBudgets: { [l.category]: null } });
    return API.month(key, { lines: { [l.id]: { amount: null, pot: null, note: null } } });
  };
  const keepForGood = () => {
    if (l.kind === 'own' || l.kind === 'support') { API.plan({ categories: { [l.category]: { budget: l.amount } } }).then(ok => ok && reset()); return; }
    if (l.planId) { const o = ((M.month.lines || {})[l.id]) || {}; const patch = { amount: l.amount + (l.kind === 'pot' ? 0 : 0) }; if (o.pot) patch.pot = o.pot; API.plan({ lines: { [l.planId]: patch } }).then(ok => ok && reset()); }
  };
  const status = () => {
    if (l.kind === 'buffer' && !l.pot) return html`<span class="tiny muted">stays put</span>`;
    if (l.transfer) {
      if (l.final <= 0.004) return html`<span class="tiny muted">nothing this month</span>`;
      if (l.done && l.kind === 'joint' && l.covered + l.ticked > l.final + 0.004) return html`<span class="chip good"><${Icon} name="check" size=${11} /> Done</span><span class="tiny muted">${money(l.covered + l.ticked - l.final)} more than this share</span>`;
      if (l.done) return html`<span class="chip good"><${Icon} name="check" size=${11} /> Done</span>`;
      return html`<span class="tiny" style=${{ color: 'var(--warn-ink)', fontWeight: 700 }}>${money(l.left)} to move</span>`;
    }
    if (l.left < -0.005) return html`<span class="chip crit">${money(-l.left)} over</span>`;
    return html`<span class="tiny muted">${money(l.left)} left</span>`;
  };
  const notes = [];
  if (l.note) notes.push(html`<span>${l.note}</span>`);
  if (l.redirected) notes.push(html`<span class="chip warn">Instead of ${(pm[l.redirected] || {}).name || 'another pot'}</span>`);
  if (l.cascaded) notes.push(html`<span class="chip good">${(pm[l.cascaded] || {}).name || 'A goal'} is full, so this moves here</span>`);
  const [showCovered, setShowCovered] = useState(false);
  if (l.covered > 0.004 && l.transfer && l.kind === 'joint') notes.push(html`<button class="linkish" aria-expanded=${showCovered} onClick=${() => setShowCovered(!showCovered)}>${money(l.covered)} already put in from ${S.me === mem.id ? 'your' : possessive(mem.id)} own account</button>`);
  else if (l.covered > 0.004 && l.transfer) notes.push(html`<span>${money(l.covered)} already moved</span>`);
  if (l.covered > 0.004 && !l.transfer) notes.push(html`<span>${money(l.covered)} spent so far</span>`);
  if (ticked && l.ticked > 0.004) notes.push(html`<span>Moved ${money(l.ticked)} ${l.tick.at ? 'on ' + dayLabel(l.tick.at) : ''}</span>`);
  if (l.cut > 0.004) notes.push(html`<span class="chip warn">Reduced by ${money(l.cut)}</span>`);
  if (l.overridden) notes.push(html`<span class="chip warn">Changed for this month</span><span class="ov-acts"><button class="btn ghost sm ov-btn" onClick=${keepForGood} disabled=${S.readOnly}>Keep every month</button><button class="btn ghost sm ov-btn" onClick=${reset} disabled=${S.readOnly}>Undo</button></span>`);
  if (l.kind === 'buffer') notes.push(html`<select class="field buffer-sel" aria-label="Where the extra goes" value=${l.pot || ''}
    onChange=${e => API.month(key, { lines: { ['buffer:' + mem.id]: { pot: e.target.value || 'buffer' } } })}><option value="">Keep in account</option>${E.pots(S.plan).map(p => html`<option value=${p.id}>Send to ${p.name}</option>`)}</select>`);
  return html`<div class=${cls('line', l.done && l.transfer && 'done')}>
    <div>${canTick ? html`<${Check} checked=${ticked || autoDone} disabled=${autoDone || S.readOnly} onToggle=${toggle} label=${'Mark ' + l.label + ' as moved'} />` : html`<span class="swatch" style=${{ background: GROUP_META[l.group].color, width: '8px', height: '8px', borderRadius: '50%', margin: '7px' }}></span>`}</div>
    <div style=${{ minWidth: 0 }}><div class="lname">${l.label}${l.extra && html` <span class="chip ghost">one-off</span>`}</div>${notes.length > 0 && html`<div class="lnote">${notes}</div>`}</div>
    <div class="lamt">
      ${l.kind === 'buffer' ? html`<span class="amt">${money(l.final)}</span>` : html`<${EditMoney} value=${l.amount} overridden=${l.overridden} title=${'Change ' + l.label + ' for this month'} onCommit=${setAmount} />`}
      ${l.cut > 0.004 && html`<span class="tiny muted">pays ${money(l.final)}</span>`}
      ${status()}
      ${l.extra && html`<button class="btn ghost sm" style=${{ minHeight: '22px', padding: '0 6px' }} onClick=${() => API.month(key, { extra: { [l.id]: { deleted: true } } })}>Remove</button>`}
    </div>
    ${showCovered && l.kind === 'joint' && html`<${PoolFromOwn} M=${M} mem=${mem} l=${l} />`}
  </div>`;
}
// What counts towards a person's share of a shared pool (same rule as the engine): money moved into it, and that
// pool's budgets paid from their own account or card.
function poolFromOwnTxns(M, memId, poolId) {
  const pc = new Set(E.categories(S.plan).filter(c => c.payer === poolId).map(c => c.id));
  const am = E.accountMap(S.plan);
  return (M.txns || []).filter(t => t.member === memId && ((pc.has(t.category) && !(am[t.account] && am[t.account].owner === 'joint')) || t.category === 'xfer:' + poolId))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

function defaultAccountFor(memberId) {
  const m = S.plan.members && S.plan.members[memberId];
  if (memberId === 'joint') { const a = E.accounts(S.plan).find(a => a.owner === 'joint' && a.type === 'current'); return a ? a.id : ''; }
  return (m && m.defaultAccount) || '';
}
function defaultDateFor(key) { const td = todayStr(); if (E.monthOf(td) === key) return td; return key < E.monthOf(td) ? key + '-' + E.pad(E.daysInMonth(key)) : key + '-01'; }
function parseQuick(text) {
  let s = ' ' + String(text || '') + ' ';
  let date = null, amount = null;
  const td = todayStr();
  if (/\byesterday\b/i.test(s)) { const d = new Date(); d.setDate(d.getDate() - 1); date = `${d.getFullYear()}-${E.pad(d.getMonth() + 1)}-${E.pad(d.getDate())}`; s = s.replace(/\byesterday\b/i, ' '); }
  else if (/\btoday\b/i.test(s)) { date = td; s = s.replace(/\btoday\b/i, ' '); }
  const dm = s.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s/);
  if (dm) { let y = dm[3] ? +dm[3] : +td.slice(0, 4); if (y < 100) y += 2000; date = `${y}-${E.pad(+dm[2])}-${E.pad(+dm[1])}`; s = s.replace(dm[0], ' '); }
  const am = [...s.matchAll(/(?:£\s?)?(\d+(?:[.,]\d{1,2})?)(?=\s)/g)];
  if (am.length) { const m = am[am.length - 1]; amount = +m[1].replace(',', '.'); s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); }
  return { desc: s.replace(/\s+/g, ' ').trim(), amount, date };
}
function addTxn(key, t) {
  const id = uid('t');
  const txn = Object.assign({ createdAt: new Date().toISOString(), by: S.viewerId || null, source: 'manual' }, t);
  const mk = E.monthOf(txn.date) || key;
  return API.month(mk, { txns: { [id]: txn } }).then(ok => {
    if (ok) toast(`Added ${txn.desc || 'spending'} · ${money(txn.amount)} in ${categoryName(S.plan, txn.category)}${mk !== S.monthKey ? ' (' + monthLabel(mk) + ')' : ''}`, { label: 'Undo', fn: () => API.month(mk, { txns: { [id]: { deleted: true } } }) });
    return ok;
  });
}
function learnRule(desc, category) {
  const key = E.merchantKey(desc);
  if (!key || key.length < 3 || !category) return;
  const target = E.ruleTargetFor(S.plan, category);
  const exists = E.rules(S.plan).find(r => E.normalise(r.match) === key);
  if (exists && exists.category === target) return;
  const label = target.startsWith('@role:') ? roleLabel(target.slice(6)) + ' of whoever paid' : categoryName(S.plan, category);
  toast(`Always file “${key}” under ${label}?`, { label: 'Always', fn: () => API.plan({ rules: { [exists ? exists.id : uid('r')]: { match: key, category: target } } }).then(ok => ok && toast('Rule saved. New spending like this sorts itself.')) }, 8000);
}

  };

    const prompt = `You sort household bank transactions into budget categories for a UK couple.\nCategories (id = name):\n${catList}\n\nTransactions (id | description | amount | who paid):\n${rows}\n\nReply with only a JSON array, one object per transaction: {"id": "<transaction id>", "category": "<category id from the list>", "confidence": "high" | "low"}. Use only ids from the category list. Example: [{"id":"t1","category":"c_groceries","confidence":"high"}]`;

/* ---------- cover an overspend ---------- */
function CoverModal({ cat, monthKey }) {
  const M = model(monthKey);
  const c = M.catById[cat];
  const need = c ? E.r2(c.spent - c.budget) : 0;
  const payerLines = c ? M.members.filter(m => poolOf(c.payer) || m.id === c.payer) : [];
  const sources = M.cats.filter(x => x.id !== cat && x.left > 0.005 && (x.kind === 'discretionary' || x.kind === 'living')).sort((a, b) => (a.payer === c.payer ? -1 : 0) - (b.payer === c.payer ? -1 : 0) || b.left - a.left);
  const potLines = payerLines.flatMap(m => M.res[m.id].lines.filter(l => l.kind === 'pot' && l.final > 0.005 && l.left > 0.005).map(l => Object.assign({ member: m.id }, l)));
  const [amt, setAmt] = useState(String(need));
  if (!c) return null;
  const a = () => Math.max(0, parseMoney(amt) || 0);
  const fromCat = s => { API.month(monthKey, { budgetMoves: { [uid('m')]: { from: s.id, to: cat, amount: E.r2(Math.min(a(), s.left)), at: todayStr() } } }).then(ok => ok && (closeModal(), toast(`Moved ${money(Math.min(a(), s.left))} from ${s.name} to ${c.name}`))); };
  const fromPotLine = l => { const take = E.r2(Math.min(a(), l.left)); API.month(monthKey, { lines: { [l.id]: { amount: E.r2(l.amount - take), note: `${money(take)} covered ${c.name}` } }, catBudgets: { [cat]: E.r2((M.month.catBudgets && M.month.catBudgets[cat] != null ? +M.month.catBudgets[cat] : c.base) + take) } }).then(ok => ok && (closeModal(), toast(`Saving ${money(take)} less into ${l.label} this month to cover ${c.name}`))); };
  return html`<${Modal} title=${`Cover ${c.name}`} onClose=${closeModal}>
    <p class="ink2">${c.name} is <b>${money(need)}</b> over its ${money(c.budget)} budget. Choose where the money comes from. This only changes ${monthLabel(monthKey)}.</p>
    <label class="lab" style=${{ marginTop: '12px', maxWidth: '200px' }}>Amount to cover<div class="money-in"><span>£</span><input class="field" id="cover-amt" inputmode="decimal" value=${amt} onInput=${e => setAmt(e.target.value)} /></div></label>
    <h3 style=${{ marginTop: '16px' }}>From another budget with money left</h3>
    <div class="list">${sources.length ? sources.slice(0, 8).map(s => html`<div class="li"><div class="grow"><div class="title">${s.name}</div><div class="meta">${money(s.left)} left · ${payerLabel(s.payer)}</div></div><button class="btn sm" onClick=${() => fromCat(s)}>Take ${money(Math.min(a(), s.left))}</button></div>`) : html`<div class="muted small">No other budget has money left this month.</div>`}</div>
    <h3 style=${{ marginTop: '16px' }}>Or save a little less this month</h3>
    <div class="list">${potLines.length ? potLines.map(l => html`<div class="li"><div class="grow"><div class="title">${l.label}</div><div class="meta">${memberName(l.member)} · ${money(l.left)} still to move</div></div><button class="btn sm" onClick=${() => fromPotLine(l)}>Use ${money(Math.min(a(), l.left))}</button></div>`) : html`<div class="muted small">No pot transfers left to reduce this month.</div>`}</div>
  <//>`;
}

/* ---------- Claude's category suggestions ---------- */
function SuggestModal({ monthKey: key, sugg }) {
  const M = model(key);
  const [pick, setPick] = useState(Object.fromEntries(sugg.map(s => [s.id, s.confidence !== 'low'])));
  const apply = () => {
    const patch = {};
    sugg.forEach(s => { if (pick[s.id]) patch[s.id] = { category: s.category }; });
    const n = Object.keys(patch).length;
    if (!n) { closeModal(); return; }
    API.month(key, { txns: patch }).then(ok => { if (ok) { closeModal(); toast(`Sorted ${n} transaction${n > 1 ? 's' : ''}`); } });
  };
  return html`<${Modal} title="Claude's suggestions" onClose=${closeModal} foot=${html`<button class="btn ghost" onClick=${closeModal}>Cancel</button><button class="btn primary" onClick=${apply}>Apply ticked</button>`}>
    ${sugg.length ? html`<div class="list">${sugg.map(s => { const t = M.txns.find(x => x.id === s.id); if (!t) return null; return html`<div class="li"><${Check} checked=${!!pick[s.id]} label=${'Use suggestion for ' + t.desc} onToggle=${() => setPick(Object.assign({}, pick, { [s.id]: !pick[s.id] }))} />
      <div class="grow"><div class="title">${t.desc} <span class="muted">· ${money(t.amount)}</span></div><div class="meta">${categoryName(S.plan, s.category)}${s.confidence === 'low' ? ' · not sure' : ''}</div></div></div>`; })}</div>`
      : html`<div class="empty">Claude couldn't match these to your categories. Pick them by hand.</div>`}
  <//>`;
}

/* ---------- bank statement import ---------- */
function ImportModal() {
  const [text, setText] = useState('');
  const [fileName, setFileName] = useState('');
  const [account, setAccount] = useState(defaultAccountFor(S.me || 'm1'));
  const [negOut, setNegOut] = useState(null);
  const [rows, setRows] = useState(null);
  const [drag, setDrag] = useState(false);
  const accObj = account && S.plan.accounts[account];
  const member = accObj ? (accObj.owner === 'joint' ? 'joint' : accObj.owner) : (S.me || 'm1');
  const build = (src, neg) => {
    const parsed = E.bankRows(src, { outIsNegative: false });
    if (!parsed.rows.length) { setRows([]); return; }
    const single = parsed.cols && parsed.cols.amount >= 0 && parsed.cols.debit < 0;
    let n = neg;
    if (n == null) n = single ? (accObj && accObj.type === 'credit' ? false : parsed.rows.filter(r => r.amount < 0).length > parsed.rows.length / 2) : false;
    setNegOut(single ? n : null);
    const existing = [];
    Object.values(S.months).forEach(m => E.txnsOf(m).forEach(t => existing.push(t)));
    const out = parsed.rows.map((r, i) => {
      const amount = single && n ? -r.amount : r.amount;
      const g = E.categorise(S.plan, r.desc, member === 'joint' ? (S.me || 'm1') : member, amount);
      const dup = existing.find(t => t.date === r.date && Math.abs((+t.amount || 0) - amount) < 0.005 && (E.merchantKey(t.desc) === E.merchantKey(r.desc) || t.source === 'import'));
      const incoming = amount < 0;
      return { i, date: r.date, desc: r.desc, amount: E.r2(amount), category: g ? g.category : (incoming ? 'income' : ''), auto: !!g, dup: !!dup, use: !dup && !(incoming && (!g || g.category === 'income')) };
    });
    setRows(out);
  };
  const onFile = f => { if (!f) return; setFileName(f.name); const rd = new FileReader(); rd.onload = () => { setText(String(rd.result || '')); build(String(rd.result || ''), null); }; rd.readAsText(f); };
  const doImport = () => {
    const chosen = rows.filter(r => r.use);
    if (!chosen.length) { toast('Tick at least one row'); return; }
    const byMonth = {};
    chosen.forEach(r => { const mk = E.monthOf(r.date); (byMonth[mk] = byMonth[mk] || {})[uid('i')] = { date: r.date, desc: r.desc, amount: r.amount, category: r.category || null, member, account: account || null, createdAt: new Date().toISOString(), source: 'import', by: S.viewerId || null }; });
    Promise.all(Object.entries(byMonth).map(([mk, txns]) => API.month(mk, { txns }))).then(res => { if (res.every(Boolean)) { closeModal(); toast(`Imported ${chosen.length} transaction${chosen.length > 1 ? 's' : ''}${Object.keys(byMonth).length > 1 ? ' across ' + Object.keys(byMonth).length + ' months' : ''}`); } });
  };
  const used = rows ? rows.filter(r => r.use) : [];
  return html`<${Modal} title="Import a bank statement" wide=${true} onClose=${closeModal}
    foot=${rows && rows.length ? html`<span class="small muted" style=${{ marginRight: 'auto' }}>${used.length} of ${rows.length} rows ticked · ${money(E.sum(used, r => r.amount))}</span><button class="btn ghost" onClick=${() => setRows(null)}>Start again</button><button class="btn primary" onClick=${doImport}>Import ${used.length}</button>` : null}>
    ${!rows ? html`<div class="stack">
      <p class="ink2">Download a CSV statement from Lloyds, NatWest, Amex or any bank, then drop it here. Nothing leaves this page until you press Import, and duplicates are skipped.</p>
      <label class="lab" style=${{ maxWidth: '360px' }}>Which account is this statement from?<${AccountSelect} id="imp-acc" value=${account} onChange=${setAccount} /></label>
      <div class=${cls('drop', drag && 'on')} onDragOver=${e => { e.preventDefault(); setDrag(true); }} onDragLeave=${() => setDrag(false)} onDrop=${e => { e.preventDefault(); setDrag(false); onFile(e.dataTransfer.files[0]); }}>
        <${Icon} name="upload" size=${26} /><p style=${{ marginTop: '8px' }}><b>Drop a CSV file here</b> or <label style=${{ color: 'var(--accent)', cursor: 'pointer', textDecoration: 'underline' }}>choose one<input type="file" id="imp-file" accept=".csv,text/csv,text/plain" style=${{ display: 'none' }} onChange=${e => onFile(e.target.files[0])} /></label></p>
        ${fileName && html`<p class="small muted">${fileName}</p>`}
      </div>
      <details class="fold"><summary><span class="caret"><${Icon} name="right" size=${14} /></span>Or paste the statement text</summary>
        <textarea class="field" id="imp-text" style=${{ marginTop: '8px', fontFamily: 'ui-monospace, monospace', fontSize: '12px' }} placeholder="Date,Description,Amount" value=${text} onInput=${e => setText(e.target.value)}></textarea>
        <button class="btn sm" style=${{ marginTop: '8px' }} onClick=${() => build(text, null)}>Read it</button>
      </details>
    </div>` : rows.length === 0 ? html`<div class="empty"><h3>No transactions found</h3>The file needs a date column and an amount (or paid in / paid out) column.<div style=${{ marginTop: '10px' }}><button class="btn" onClick=${() => setRows(null)}>Try another file</button></div></div>`
    : html`<div class="stack">
      ${negOut != null && html`<div class="row small"><span class="muted">In this file, money going out shows as</span><${Seg} label="Sign of spending" value=${negOut ? 'neg' : 'pos'} onChange=${v => build(text, v === 'neg')} options=${[{ value: 'neg', label: 'minus (−41.52)' }, { value: 'pos', label: 'plus (41.52)' }]} /></div>`}
      <div class="table-wrap"><table class="ledger"><thead><tr><th></th><th>Date</th><th>Description</th><th>Category</th><th class="n">Amount</th></tr></thead><tbody>
        ${rows.map((r, idx) => html`<tr style=${{ opacity: r.use ? 1 : 0.55 }}>
          <td><${Check} checked=${r.use} label=${'Import ' + r.desc} onToggle=${() => setRows(rows.map((x, j) => j === idx ? Object.assign({}, x, { use: !x.use }) : x))} /></td>
          <td style=${{ whiteSpace: 'nowrap' }}>${dayLabel(r.date, { weekday: undefined })}</td>
          <td>${r.desc}${r.dup ? html` <span class="chip warn">already logged</span>` : ''}${r.amount < 0 ? html` <span class="chip">money in</span>` : ''}</td>
          <td style=${{ minWidth: '200px' }}><${CatSelect} id=${'imp-cat-' + idx} value=${r.category} onChange=${v => setRows(rows.map((x, j) => j === idx ? Object.assign({}, x, { category: v }) : x))} emptyLabel="Needs a category" /></td>
          <td class="n">${money(r.amount)}</td></tr>`)}
      </tbody></table></div>
    </div>`}
  <//>`;
}

/* ===== UI part 3: pots & debts, review, travel, Sri Lanka, big plans ===== */
function parseWhen(when) {
  const m = String(when || '').toLowerCase().match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{4})/);
  if (!m) return null;
  const i = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[1]) + 1;
  return m[2] + '-' + E.pad(i);
}

function potMonthly(potId) { return E.sum(E.planLines(S.plan).filter(l => l.pot === potId), l => l.amount); }

// the household's rupee accounts, from the plan: an interest-paying fund and an everyday account
function rupeeFund() { return E.accounts(S.plan).find(a => a.currency === 'LKR' && +a.rate > 0) || null; }
function rupeeAccount() { return E.accounts(S.plan).find(a => a.currency === 'LKR' && !(+a.rate > 0)) || null; }
function PotMoveModal({ pot, mode }) {
  const M = model();
  const p = S.plan.pots[pot];
  const bal = M.endBal[pot] || 0;
  const [amt, setAmt] = useState('');
  const [note, setNote] = useState('');
  const [m, setM] = useState(mode || 'in');
  if (!p) return null;
  const save = () => {
    const a = parseMoney(amt);
    if (a == null) { toast('Add an amount'); return; }
    let delta = m === 'in' ? a : m === 'out' ? -a : E.r2(a - bal);
    API.month(S.monthKey, { potMoves: { [uid('p')]: { pot, amount: E.r2(delta), date: defaultDateFor(S.monthKey), note: note.trim() || (m === 'set' ? 'Balance check' : m === 'in' ? 'Added' : 'Taken out'), by: S.viewerId || null } } })
      .then(ok => { if (ok) { closeModal(); toast(m === 'set' ? `${p.name} now shows ${money(a)}` : `${m === 'in' ? 'Added' : 'Took'} ${money(a)} ${m === 'in' ? 'to' : 'from'} ${p.name}`); } });
  };
  return html`<${Modal} title=${p.name} onClose=${closeModal} foot=${html`<button class="btn ghost" onClick=${closeModal}>Cancel</button><button class="btn primary" onClick=${save}>Save</button>`}>
    <p class="ink2">Balance now <b>${money(bal)}</b>. Use this for money moved outside the payday transfers, spending from the pot, or to match a bank statement.</p>
    <div class="stack" style=${{ marginTop: '12px' }}>
      <${Seg} label="What happened" value=${m} onChange=${setM} options=${[{ value: 'in', label: 'Added money' }, { value: 'out', label: 'Took money out' }, { value: 'set', label: 'Set the actual balance' }]} />
      <div class="form-grid">
        <label class="lab">${m === 'set' ? 'Actual balance' : 'Amount'}<div class="money-in"><span>£</span><input class="field" id="pm-amt" inputmode="decimal" value=${amt} onInput=${e => setAmt(e.target.value)} /></div></label>
        <label class="lab">Note <span class="hint">optional</span><input class="field" id="pm-note" value=${note} onInput=${e => setNote(e.target.value)} /></label>
      </div>
      ${p.currency === 'LKR' && html`<p class="small" style=${{ color: 'var(--rupee)' }}>This pot is kept in rupees. Enter the pound value (rupees ÷ ${E.fx(S.plan, 'LKR')}).</p>`}
    </div>
  <//>`;
}
function PotModal({ pot }) {
  const isNew = !pot;
  const p0 = pot ? S.plan.pots[pot] : { name: '', target: 0, priority: E.pots(S.plan).length + 1, account: '', opening: 0 };
  const [f, setF] = useState(Object.assign({}, p0));
  const set = (k, v) => setF(Object.assign({}, f, { [k]: v }));
  const save = () => {
    if (!String(f.name || '').trim()) { toast('Give the pot a name'); return; }
    const id = pot || uid('p');
    const data = { name: f.name.trim(), priority: +f.priority || 99, account: f.account || null, currency: f.currency || 'GBP', opening: +f.opening || 0, why: f.why || '', group: f.group || 'goals' };
    if (!f.targetFrom) data.target = +f.target || 0;
    if (f.runningCost != null) data.runningCost = +f.runningCost || 0;
    API.plan({ pots: { [id]: data } }).then(ok => ok && (closeModal(), toast(isNew ? 'Pot added' : 'Pot saved')));
  };
  const markDone = () => API.plan({ pots: { [pot]: { status: f.status === 'done' ? 'saving' : 'done' } } }).then(ok => ok && closeModal());
  const del = () => API.plan({ pots: { [pot]: { deleted: true } } }).then(ok => ok && (closeModal(), toast('Pot removed', { label: 'Undo', fn: () => API.plan({ pots: { [pot]: { deleted: false } } }) })));
  return html`<${Modal} title=${isNew ? 'New pot' : 'Edit ' + p0.name} onClose=${closeModal}
    foot=${html`${!isNew && html`<button class="btn danger ghost" style=${{ marginRight: 'auto' }} onClick=${del}>Remove</button>`}${!isNew && html`<button class="btn" onClick=${markDone}>${f.status === 'done' ? 'Start saving again' : 'Mark as done'}</button>`}<button class="btn primary" onClick=${save}>Save</button>`}>
    <div class="form-grid">
      <label class="lab" style=${{ gridColumn: '1 / -1' }}>Name<input class="field" id="pot-name" value=${f.name} onInput=${e => set('name', e.target.value)} /></label>
      ${f.targetFrom ? html`<label class="lab">Target<span class="hint">set by the ${f.targetFrom === 'house' ? 'house' : f.targetFrom === 'wedding' ? 'wedding' : 'vehicle'} calculator: ${money(E.potTarget(S.plan, f), { whole: true })}</span></label>`
        : html`<label class="lab">Target <span class="hint">0 = no limit</span><div class="money-in"><span>£</span><input class="field" id="pot-target" inputmode="decimal" value=${f.target || ''} onInput=${e => set('target', parseMoney(e.target.value) || 0)} /></div></label>`}
      <label class="lab">Priority <span class="hint">1 = fill first</span><input class="field" id="pot-pri" type="number" min="1" value=${f.priority} onInput=${e => set('priority', e.target.value)} /></label>
      <label class="lab">Kept in<${AccountSelect} id="pot-acc" value=${f.account} onChange=${v => set('account', v)} /></label>
      <label class="lab">Currency<select class="field" id="pot-cur" value=${f.currency || 'GBP'} onChange=${e => set('currency', e.target.value)}><option value="GBP">Pounds</option><option value="LKR">Rupees</option></select></label>
      <label class="lab">Balance at the start <span class="hint">before this planner</span><div class="money-in"><span>£</span><input class="field" id="pot-open" inputmode="decimal" value=${f.opening || ''} onInput=${e => set('opening', parseMoney(e.target.value) || 0)} /></div></label>
      <label class="lab">Group<select class="field" id="pot-grp" value=${f.group || 'goals'} onChange=${e => set('group', e.target.value)}><option value="safety">Safety net</option><option value="family">Family</option><option value="goals">Goals</option><option value="srilanka">Sri Lanka family</option></select></label>
      <label class="lab" style=${{ gridColumn: '1 / -1' }}>What it's for<input class="field" id="pot-why" value=${f.why || ''} onInput=${e => set('why', e.target.value)} /></label>
    </div>
    <p class="small muted" style=${{ marginTop: '12px' }}>When a pot reaches its target, its monthly money moves to the next unfinished pot by priority. Set the monthly amount on Plan & settings, under Savings lines.</p>
  <//>`;
}

/* ---------- month review ---------- */
function Review() {
  const M = model();
  const key = M.key;
  const T = M.totals;
  const rev = (M.month.review) || {};
  const [note, setNote] = useState(rev.note || '');
  const [claudeText, setClaudeText] = useState('');
  const [busy, setBusy] = useState(false);
  const ctl = useRef(null);
  useEffect(() => { setNote(rev.note || ''); }, [key, rev.note]);
  const divRows = M.groups.filter(g => g.budget > 0 || g.spent > 0).map(g => ({ name: g.name, value: E.r2(g.budget - g.spent) }));
  const disc = M.cats.filter(c => c.kind === 'discretionary');
  const leftovers = disc.filter(c => c.left > 0.5);
  const leftTotal = E.r2(E.sum(leftovers, c => c.left));
  const [sweepPot, setSweepPot] = useState((E.pots(S.plan).find(p => E.potTarget(S.plan, p) > 0 && !E.isComplete(S.plan, p, M.endBal)) || {}).id || '');
  const merchants = {};
  M.txns.filter(t => M.catById[t.category]).forEach(t => { const k = E.merchantKey(t.desc) || t.desc; merchants[k] = (merchants[k] || 0) + (+t.amount || 0); });
  const top = Object.entries(merchants).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const history = Object.keys(S.months).filter(k => k <= thisMonth()).sort().slice(-12).map(k => { const mm = model(k); return { key: k, spent: mm.totals.spent, saved: mm.totals.saved }; }).filter(r => r.spent > 0 || r.saved > 0);
  const sweep = () => {
    if (!sweepPot || !leftovers.length) return;
    const moves = {};
    leftovers.forEach(c => { moves[uid('s')] = { pot: sweepPot, amount: E.r2(c.left), fromCategory: c.id, date: key + '-' + E.pad(E.daysInMonth(key)), note: 'Left over in ' + c.name }; });
    API.month(key, { potMoves: moves }).then(ok => ok && toast(`Moved ${money(leftTotal)} of leftovers into ${S.plan.pots[sweepPot].name}`));
  };
  const close = () => API.month(key, { review: { closed: !rev.closed, closedAt: todayStr(), summary: { income: T.income, spent: T.spent, saved: T.saved, planSpend: T.planSpend } } });
  const askClaude = async () => {
    if (!S.sample) return;
    ctl.current = new AbortController();
    setBusy(true); setClaudeText('Thinking…');
    const people = M.members.map(m => { const r = M.res[m.id]; return `${memberName(m.id)}: take-home ${money(r.income)}${r.received ? '' : ' (expected)'}, planned out ${money(r.allocated)}, still to move ${money(r.toMove)}`; }).join('\n');
    const cats = M.cats.filter(c => c.budget > 0 || c.spent > 0).map(c => `${c.name} (${payerLabel(c.payer)}, ${c.kind}): budget ${money(c.budget)}, spent ${money(c.spent)}`).join('\n');
    const pots = E.pots(S.plan).map(p => `${p.name}: ${money(M.endBal[p.id] || 0)}${E.potTarget(S.plan, p) > 0 ? ' of ' + money(E.potTarget(S.plan, p)) : ''}`).join('\n');
    const about = (S.plan.household && S.plan.household.about) || '';
    const prompt = `You are reviewing one month of a UK couple's household budget.${about ? ' ' + about : ''}\n\nMonth: ${monthLabel(key)}\n\nPay:\n${people}\n\nBudgets:\n${cats}\n\nSaved into pots this month: ${money(T.saved)} of ${money(T.savePlanned)} planned.\nPot balances:\n${pots}\n\nWrite a short, warm and plain-English review for both of them. Use these headings on their own lines: "What went well", "Watch", "Next month". Two or three short bullet points under each (start bullets with "- "). Use real numbers from above. No more than 170 words. No preamble.`;
    try {
      const { text } = await S.sample(prompt, { signal: ctl.current.signal, onText: ({ text }) => setClaudeText(text), cache: false });
      setClaudeText(text);
      API.month(key, { review: { claude: text, claudeAt: todayStr() } });
    } catch (e) {
      if (e && e.code === 'cancelled') setClaudeText(e.text || '');
      else { setClaudeText(e && e.text ? e.text : ''); toast(e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? 'Claude is not available for this planner.' : "Claude couldn't write the review just now. Try again later."); }
    } finally { setBusy(false); }
  };
  const shownClaude = claudeText || rev.claude || '';
  return html`<div class="page">
    <${Banners} />
    <div class="kpis">
      <div class="kpi"><div class="lbl">Pay in</div><div class="val">${money(T.income, { auto: true })}</div><div class="sub">${money(T.incomeReceived, { auto: true })} received so far</div></div>
      <div class="kpi"><div class="lbl">Spent from budgets</div><div class="val">${money(T.spent, { auto: true })}</div><div class="sub">${T.spent <= T.planSpend ? money(T.planSpend - T.spent, { auto: true }) + ' under plan' : money(T.spent - T.planSpend, { auto: true }) + ' over plan'}</div></div>
      <div class="kpi"><div class="lbl">Saved into pots</div><div class="val">${money(T.saved, { auto: true })}</div><div class="sub">of ${money(T.savePlanned, { auto: true })} planned</div></div>
      <div class="kpi"><div class="lbl">Savings rate</div><div class="val">${T.income ? pct(T.saved / T.income) : '—'}</div><div class="sub">${T.income ? pct(T.savePlanned / T.income) + ' planned' : ''}</div></div>
    </div>
    <div class="grid g2">
      <${Panel} title="Under or over budget, by area" sub="Right of the line is money left; left of it is overspending.">
        ${divRows.length ? html`<${DivergingBars} rows=${divRows} />` : html`<div class="empty">No budgets yet.</div>`}
        <div class="legend"><span><i class="k-box" style=${{ background: 'var(--s1)' }}></i>Under budget</span><span><i class="k-box" style=${{ background: 'var(--s8)' }}></i>Over budget</span></div>
      <//>
      <${Panel} title="Who paid for what" sub="How each of you carried the month.">
        <div class="table-wrap"><table class="ledger"><thead><tr><th></th>${M.members.map(m => html`<th class="n">${memberName(m.id, { you: true })}</th>`)}</tr></thead><tbody>
          <tr><td>Pay</td>${M.members.map(m => html`<td class="n">${money(M.res[m.id].income)}</td>`)}</tr>
          ${(M.pools || []).map(pv => html`<tr><td>Into the ${pv.id === 'joint' ? 'joint account' : poolShort(pv).toLowerCase()}</td>${M.members.map(m => html`<td class="n">${money(E.sum(M.res[m.id].lines.filter(l => (l.kind === 'joint' || l.kind === 'cover') && (l.pool || 'joint') === pv.id), l => l.covered + l.ticked))}</td>`)}</tr>`)}
          <tr><td>Own bills & personal spending</td>${M.members.map(m => html`<td class="n">${money(E.sum(M.res[m.id].lines.filter(l => l.kind === 'own'), l => l.covered))}</td>`)}</tr>
          <tr><td>Saved into pots</td>${M.members.map(m => html`<td class="n">${money(E.sum(M.res[m.id].lines.filter(l => l.kind === 'pot' || (l.kind === 'buffer' && l.pot)), l => l.covered + l.ticked))}</td>`)}</tr>
          <tr><td>Sri Lanka family support</td>${M.members.map(m => html`<td class="n">${money(E.sum(M.res[m.id].lines.filter(l => l.kind === 'support'), l => l.covered))}</td>`)}</tr>
          <tr><td>Debt repaid</td>${M.members.map(m => html`<td class="n">${money(E.sum(M.res[m.id].lines.filter(l => l.kind === 'debt'), l => l.covered + l.ticked))}</td>`)}</tr>
        </tbody></table></div>
        <p class="small muted" style=${{ marginTop: '8px' }}>Spent straight from the ${(M.pools || []).length > 1 ? 'shared accounts' : 'joint account'}: ${money(M.byMember.joint || 0)}.</p>
      <//>
    </div>
    <div class="grid g2">
      <${Panel} title="Discretionary spending" sub=${`${money(T.discretionarySpent)} on takeaways, eating out, personal money and other choices this month.`}>
        <${BudgetBars} rows=${disc.filter(c => c.budget > 0 || c.spent > 0).map(c => ({ name: c.name, sub: payerLabel(c.payer, { you: true }), budget: c.budget, spent: c.spent }))} />
        ${top.length > 0 && html`<h3 style=${{ marginTop: '16px' }}>Where it went</h3><div class="list">${top.map(([k, v]) => html`<div class="li"><div class="grow title" style=${{ textTransform: 'capitalize' }}>${k}</div><div class="amt">${money(v)}</div></div>`)}</div>`}
      <//>
      <${Panel} title="Leftovers" sub="Money not spent from discretionary budgets can go into a pot instead of drifting.">
        ${leftovers.length ? html`<div class="stack">
          <div class="big" style=${{ fontSize: '30px', fontWeight: 800 }}>${money(leftTotal)}</div>
          <div class="small muted">${leftovers.map(c => c.name + ' ' + money(c.left)).join(' · ')}</div>
          <div class="row" style=${{ flexWrap: 'nowrap' }}><${PotSelect} id="sweep-pot" value=${sweepPot} onChange=${setSweepPot} /><button class="btn primary" onClick=${sweep} disabled=${S.readOnly}>Move it</button></div>
          <p class="tiny muted">Best done on the last day of the month, once the spending is in.</p></div>`
          : html`<div class="empty">Nothing left over in discretionary budgets.</div>`}
      <//>
    </div>
    <${Panel} title="Notes for this month" sub="Shared between you both. Saved when you click away." actions=${html`<button class=${cls('btn sm', rev.closed ? '' : 'primary')} onClick=${close} disabled=${S.readOnly}>${rev.closed ? 'Reopen month' : 'Close the month'}</button>`}>
      ${rev.closed && html`<div class="banner good" style=${{ marginBottom: '10px' }}><${Icon} name="check" /><div class="grow">Closed on ${dayLabel(rev.closedAt)}.</div></div>`}
      <textarea class="field" id="review-note" placeholder="What happened this month, decisions you made, things to change next month" value=${note} onInput=${e => setNote(e.target.value)} onBlur=${() => { if (note !== (rev.note || '')) API.month(key, { review: { note } }); }}></textarea>
      ${S.sample && html`<div class="row" style=${{ marginTop: '14px' }}><button class="btn" onClick=${askClaude} disabled=${busy}><${Icon} name="spark" size=${15} />${busy ? 'Claude is writing…' : shownClaude ? 'Ask Claude again' : 'Ask Claude to review the month'}</button>${busy && html`<button class="btn ghost sm" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button>`}</div>`}
      ${shownClaude && html`<div class="claude-out" style=${{ marginTop: '12px' }}>${shownClaude}</div>`}
    <//>
    ${history.length >= 2 && html`<${Panel} title="Month by month" sub="Spent from budgets and saved into pots."><${TrendBars} rows=${history} /><//>`}
  </div>`;
}

/* ---------- travel ---------- */
const TRAVEL_OPTIONS = [
  { id: 'A', name: 'Full budget', monthly: 625, trips: 'Both trips, mid-range', from: '£350 from the house fund, £75 from eating out', cost: 'House fund about £24,000 smaller by 2031', set: { travel: 625, house: 0, eatingout: 75, takeaways: null } },
  { id: 'B', name: 'Middle (recommended)', monthly: 450, trips: 'Both trips; long-haul to Sri Lanka with family every other year', from: '£150 house fund, £50 takeaways, £50 eating out', cost: 'House fund about £8,500 smaller by 2031', set: { travel: 450, house: 200, eatingout: 100, takeaways: 100 } },
  { id: 'C', name: 'Keep £200', monthly: 200, trips: 'One trip a year, or two budget trips', from: 'Nothing changes', cost: 'No change', set: { travel: 200, house: 350, eatingout: 150, takeaways: 150 } },
];
function Travel() {
  const ts = E.trips(S.plan);
  const travelPot = E.pots(S.plan).find(p => p.sinking) || null;
  const [confirm, setConfirm] = useState(null);
  const cur = (S.plan.travel && S.plan.travel.option) || 'C';
  const lines = E.planLines(S.plan);
  const travelLine = travelPot && lines.find(l => l.pot === travelPot.id);
  const housePot = E.pots(S.plan).find(p => p.targetFrom === 'house');
  const houseLine = housePot && lines.find(l => l.pot === housePot.id);
  const catByRole = r => E.categories(S.plan).find(c => c.role === r);
  const apply = opt => {
    const patch = { travel: { option: opt.id }, lines: {}, categories: {} };
    if (travelLine) patch.lines[travelLine.id] = { amount: opt.set.travel };
    if (houseLine && opt.set.house != null) patch.lines[houseLine.id] = { amount: opt.set.house };
    if (opt.set.eatingout != null && catByRole('eatingout')) patch.categories[catByRole('eatingout').id] = { budget: opt.set.eatingout };
    if (opt.set.takeaways != null && catByRole('takeaways')) patch.categories[catByRole('takeaways').id] = { budget: opt.set.takeaways };
    API.plan(patch).then(ok => { if (ok) { setConfirm(null); toast(`Switched to option ${opt.id}: £${opt.monthly} a month for trips`); } });
  };
  const M = model();
  const P = projection();
  return html`<div class="page">
    ${ts.map(t => html`<${TripCard} key=${t.id} t=${t} pot=${travelPot} P=${P} M=${M} />`)}
    <div class="row"><button class="btn" onClick=${() => { const id = uid('trip'); API.plan({ trips: { [id]: { name: 'New trip', when: '', order: ts.length + 1, pot: travelPot ? travelPot.id : null, status: 'idea', budget: { b1: { label: 'Flights', amount: 0, order: 1 }, b2: { label: 'Places to stay', amount: 0, order: 2 }, b3: { label: 'Spending', amount: 0, order: 3 } } } } }); }} disabled=${S.readOnly}><${Icon} name="plus" />Plan another trip</button></div>
    <${Panel} title="Two trips a year" sub="A short-haul and a long-haul trip for two costs about £7,500 a year at a comfortable level (estimates for 2026). Pick how much to set aside.">
      <div class="grid g3">${TRAVEL_OPTIONS.map(o => html`<div class="panel flat" style=${{ borderColor: cur === o.id ? 'var(--accent)' : null, borderWidth: cur === o.id ? '2px' : null }}>
        <div class="row"><b>Option ${o.id}</b>${cur === o.id && html`<span class="chip accent">Current</span>`}</div>
        <div style=${{ fontSize: '24px', fontWeight: 800, margin: '4px 0' }}>£${o.monthly}<span class="small muted"> a month</span></div>
        <div class="small strong">${o.name}</div><div class="small ink2" style=${{ marginTop: '6px' }}>${o.trips}</div>
        <div class="tiny muted" style=${{ marginTop: '6px' }}>Comes from: ${o.from}</div><div class="tiny muted">Cost: ${o.cost}</div>
        ${cur !== o.id && html`<button class="btn sm" style=${{ marginTop: '10px' }} onClick=${() => setConfirm(o)} disabled=${S.readOnly}>Switch to ${o.id}</button>`}
      </div>`)}</div>
