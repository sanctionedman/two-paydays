<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Two Paydays: a household money planner for two paydays. Everything you enter stays on your computer.">
<meta name="theme-color" content="#0b6b5c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Paydays">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Two Paydays</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-display: swap; font-weight: 200 800;
  src: url(fonts/bricolage-grotesque-latin-wght.woff2) format("woff2-variations"), url(fonts/bricolage-grotesque-latin-wght.woff2) format("woff2"); }
@font-face { font-family: "Manrope"; font-style: normal; font-display: swap; font-weight: 200 800;
  src: url(fonts/manrope-latin-wght.woff2) format("woff2-variations"), url(fonts/manrope-latin-wght.woff2) format("woff2"); }
</style>
<style>
/* Layout: a household ledger with two paydays. A quiet left rail (sections, rates, who is here), a sticky month bar,
   and a working canvas of panels. Panels only where a block is a separate object; lists stay flat inside them. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --surface-2: #f6f9f8;
  --sunken: #e6edea;
  --ink: #0f1f1b;
  --ink-2: #41514c;
  --muted: #6b7a76;
  --line: #dbe3e0;
  --line-2: #c4cfcb;
  --accent: #0b6b5c;
  --accent-2: #0d806d;
  --accent-soft: #dcefe9;
  --accent-ink: #ffffff;
  --rupee: #94560a;
  --rupee-soft: #fbefd9;
  --good: #0ca30c;
  --good-ink: #0b6b1f;
  --good-soft: #e3f3e3;
  --warn: #fab219;
  --warn-ink: #7f5300;
  --warn-soft: #fdf2d8;
  --serious: #ec835a;
  --crit: #d03b3b;
  --crit-ink: #b0292a;
  --crit-soft: #fbe8e7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --grid: #e2e8e6;
  --axis: #c3cbc8;
  --quiet-mark: #b9c4c0;
  --overlay: rgba(10, 22, 19, 0.38);
  --shadow: 0 1px 2px rgba(15, 31, 27, 0.05), 0 6px 20px rgba(15, 31, 27, 0.06);
  --shadow-pop: 0 8px 28px rgba(15, 31, 27, 0.16);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 7px;
  --r: 10px;
  --r-lg: 14px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1210; --surface: #111a18; --surface-2: #15201d; --sunken: #0d1513;
    --ink: #e6eeeb; --ink-2: #b3c2bd; --muted: #889792; --line: #22302c; --line-2: #31413c;
    --accent: #3cc3a3; --accent-2: #62d4b9; --accent-soft: #10332b; --accent-ink: #032019;
    --rupee: #e8a94e; --rupee-soft: #2d2212;
    --good-ink: #46d063; --good-soft: #10291a; --warn-ink: #f4c457; --warn-soft: #2f240b; --crit-ink: #f27c7c; --crit-soft: #351616;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --grid: #1e2a27; --axis: #34433f; --quiet-mark: #4c5c57;
    --overlay: rgba(0, 0, 0, 0.55);
    --shadow: none; --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1210; --surface: #111a18; --surface-2: #15201d; --sunken: #0d1513;
  --ink: #e6eeeb; --ink-2: #b3c2bd; --muted: #889792; --line: #22302c; --line-2: #31413c;
  --accent: #3cc3a3; --accent-2: #62d4b9; --accent-soft: #10332b; --accent-ink: #032019;
  --rupee: #e8a94e; --rupee-soft: #2d2212;
  --good-ink: #46d063; --good-soft: #10291a; --warn-ink: #f4c457; --warn-soft: #2f240b; --crit-ink: #f27c7c; --crit-soft: #351616;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --grid: #1e2a27; --axis: #34433f; --quiet-mark: #4c5c57;
  --overlay: rgba(0, 0, 0, 0.55);
  --shadow: none; --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; font-family: var(--f-body); font-weight: 700; letter-spacing: 0; }
p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 18px; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 750; font-size: 19px; letter-spacing: -0.02em; line-height: 1; }
.brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 10px 10px 4px; font-weight: 700; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); font-weight: 600; text-align: left; }
.nav button:hover { background: var(--sunken); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav button .count { margin-left: auto; font-size: 11px; background: var(--crit-soft); color: var(--crit-ink); border-radius: 99px; padding: 0 7px; font-weight: 700; }
.nav svg { width: 18px; height: 18px; flex: none; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.rate-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--rupee-soft); color: var(--rupee); border-radius: var(--r-sm); padding: 7px 10px; font-weight: 700; font-size: 12.5px; }
.sync { display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.dot.local { background: var(--warn); }
.dot.off { background: var(--crit); }
.who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.sm { width: 20px; height: 20px; font-size: 9.5px; }

.main { min-width: 0; padding: 0 clamp(16px, 3vw, 36px) 64px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 0 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar h1 { margin-right: auto; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; }
.monthsw { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 2px; box-shadow: var(--shadow); }
.monthsw button { border: 0; background: none; border-radius: 99px; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.monthsw button:hover { background: var(--sunken); }
.monthsw .label { min-width: 132px; text-align: center; font-weight: 700; font-family: var(--f-display); font-size: 15px; padding: 0 4px; }
.page { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.tabbar { display: none; }

/* ---------- building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel.flat { box-shadow: none; }
.panel-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head > div:first-child { flex: 1 1 220px; min-width: 0; }
.panel-head p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 700; }
.right { text-align: right; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; min-height: 34px; }
.btn:hover { border-color: var(--ink-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.danger { color: var(--crit-ink); }
.btn.sm { padding: 4px 9px; min-height: 28px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.iconbtn { border: 0; background: none; width: 30px; height: 30px; border-radius: var(--r-sm); display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }
.iconbtn svg { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; background: var(--sunken); color: var(--ink-2); white-space: nowrap; line-height: 20px; }
.chip svg { width: 12px; height: 12px; }
.chip.good { background: var(--good-soft); color: var(--good-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.crit { background: var(--crit-soft); color: var(--crit-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.rupee { background: var(--rupee-soft); color: var(--rupee); }
.chip.ghost { background: none; border: 1px dashed var(--line-2); color: var(--muted); }
.chip.link { cursor: pointer; }

input.field, select.field, textarea.field { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 7px 10px; min-height: 34px; }
textarea.field { min-height: 80px; resize: vertical; }
input.field:focus, select.field:focus, textarea.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
label.lab { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 700; min-width: 0; }
label.lab > span.hint { font-weight: 500; color: var(--muted); }
label.lab > .editable { align-self: flex-start; margin-left: 0; }
.panel .panel.embedded { box-shadow: none; padding: 0; border: 0; background: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.money-in { position: relative; }
.money-in > span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; pointer-events: none; }
.money-in > input { padding-left: 24px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--sunken); border-radius: var(--r-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 5px; font-weight: 700; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.check { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; flex: none; color: var(--accent-ink); padding: 0; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check svg { width: 14px; height: 14px; }

/* editable value */
.editable { border: 1px dashed transparent; border-radius: 6px; padding: 1px 6px; margin: -1px -6px; cursor: text; background: none; font-weight: inherit; text-align: inherit; }
.editable:hover { border-color: var(--line-2); background: var(--surface-2); }
.editable.overridden { border-color: var(--warn); border-style: solid; }
input.inline { width: 110px; border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; text-align: right; font-variant-numeric: tabular-nums; background: var(--surface); }
input.inline.wide { width: 100%; text-align: left; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; min-width: 0; }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 700; }
.kpi .val { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.meter { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; margin-top: 9px; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 22px 22px 20px; background:
  radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 55%), var(--surface); }
.hero .big { font-size: clamp(40px, 6vw, 58px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin-top: 6px; }
.hero .lead { color: var(--ink-2); margin-top: 8px; max-width: 60ch; }
.hero-side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .title { font-weight: 650; overflow-wrap: anywhere; }
.li .meta { font-size: 12px; color: var(--muted); }
.amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.amt.neg { color: var(--good-ink); }
.ok-ico { color: var(--good-ink); }

/* budget bars */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 1.1fr) minmax(0, 2.2fr) auto; gap: 12px; align-items: center; }
.bar-row .name { font-weight: 650; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.bar-row .name small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.track { position: relative; height: 14px; background: var(--sunken); border-radius: 4px; }
.track > .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.track > .fill.over { background: var(--crit); }
.track > .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.bar-row .figs { font-size: 12.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ledger tables */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
table.ledger th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 8px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.ledger td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.ledger tr:hover td { background: var(--surface-2); }
table.ledger td.n, table.ledger th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.ledger select.field, table.ledger input.field { min-height: 30px; padding: 4px 8px; font-size: 13px; }
.group-row td { background: var(--surface-2); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }

/* payday */
.payday-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.person-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.person-head .avatar { width: 40px; height: 40px; font-size: 15px; }
.pay-input { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 12px; }
.line-group { margin-top: 14px; }
.line-group > h4 { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.line { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.line:first-of-type { border-top: 0; }
.line .lname { font-weight: 650; min-width: 0; overflow-wrap: anywhere; }
.line .lnote { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 1px; }
.line .lamt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.line .lamt .tiny { max-width: 140px; text-align: right; line-height: 1.3; }
.line.done .lname { color: var(--muted); }
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r); padding: 10px 12px; font-size: 13px; background: var(--sunken); color: var(--ink-2); }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
.banner.crit { background: var(--crit-soft); color: var(--crit-ink); }
.banner.good { background: var(--good-soft); color: var(--good-ink); }
.banner.accent { background: var(--accent-soft); color: var(--accent); }
.banner .grow { flex: 1; min-width: 0; }
.timeline { position: relative; height: 66px; margin: 6px 4px 0; }
.tl-axis { position: absolute; left: 0; right: 0; top: 30px; height: 2px; background: var(--line-2); border-radius: 2px; }
.tl-today { position: absolute; top: 18px; width: 2px; height: 26px; background: var(--ink); border-radius: 2px; }
.tl-mark { position: absolute; top: 22px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 120px; }
.tl-mark i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); display: block; }
.tl-mark span { font-size: 11px; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.25; }
.tl-mark.up { top: -2px; flex-direction: column-reverse; }
.agenda { display: flex; flex-direction: column; margin-top: 2px; }
.ag-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.ag-row:first-child { border-top: 0; }
.ag-row .ag-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); display: block; justify-self: center; }
.ag-row.past { opacity: 0.6; }
.ag-row.today { font-weight: 800; color: var(--ink); }
.ag-row.today .ag-dot { width: 3px; height: 18px; border: 0; border-radius: 2px; background: var(--ink); box-shadow: none; }
.pay-side { gap: 6px; align-items: flex-end; }
.pay-note { max-width: 220px; text-align: right; }
.th-sub { display: block; font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); }
.show-sm { display: none; }
table.ledger tr.note-row { display: none; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.linkish:hover { color: var(--ink); }
.covered-list { grid-column: 2 / -1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.covered-list .cl-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); align-items: baseline; }
.covered-list .cl-row:first-child { border-top: 0; }
.covered-list .cl-what { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.covered-list .cl-cat { color: var(--muted); font-weight: 500; font-size: 11.5px; margin-left: 4px; }
.only-narrow { display: none !important; }
.sheet-overlay { position: fixed; inset: 0; z-index: 70; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { width: min(560px, 100%); max-height: 86dvh; overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-pop); padding: 8px 14px calc(14px + env(safe-area-inset-bottom, 0px)); animation: rise .2s ease; }
.sheet-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 2px auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.sheet-head h2 { flex: 1; }
.sheet-list { display: flex; flex-direction: column; }
.sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-size: 15px; font-weight: 650; text-align: left; cursor: pointer; border-radius: 0; }
.sheet-item:first-child { border-top: 0; }
.sheet-item .grow { flex: 1; min-width: 0; }
.sheet-item svg { width: 20px; height: 20px; flex: none; color: var(--ink-2); }
.sheet-item > svg:last-child { color: var(--muted); width: 16px; height: 16px; }
.sheet-item[aria-current="page"] { color: var(--accent); }
.sheet-item[aria-current="page"] svg { color: var(--accent); }
.sheet-item:active { background: var(--sunken); }
.sheet-foot { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.update-bar { margin: 4px 0 14px; align-items: center; }
.ov-acts { display: inline-flex; gap: 2px; flex-wrap: nowrap; }
.ov-btn { min-height: 22px; padding: 0 6px; font-size: 12px; }
.buffer-sel { width: auto; max-width: 100%; min-height: 26px; padding: 1px 6px; font-size: 12px; text-overflow: ellipsis; }

/* pots */
.pots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.pot { display: flex; flex-direction: column; gap: 10px; }
.pot-top { display: flex; gap: 12px; align-items: center; }
.pot-top .grow { min-width: 0; flex: 1; }
.pot-name { font-weight: 750; font-size: 14.5px; overflow-wrap: anywhere; }
.pot-bal { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.pot-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12px; }
.pot-facts b { display: block; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pot-facts span { color: var(--muted); }
.ring { flex: none; }
.ring .track-c { stroke: var(--sunken); }
.ring .val-c { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
.ring text { fill: var(--ink); font-weight: 800; font-size: 13px; font-family: var(--f-body); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11.5px; font-family: var(--f-body); }
.chart .lbl-strong { fill: var(--ink); font-weight: 700; font-size: 12.5px; }
.chart .lbl-2 { fill: var(--ink-2); font-size: 12px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.k-line { width: 16px; height: 2px; border-radius: 2px; display: inline-block; }
.legend i.k-box { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; box-shadow: var(--shadow-pop); font-size: 12px; min-width: 120px; max-width: 260px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
#tip.on { opacity: 1; transform: none; }
#tip .tv { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
#tip .tr { display: flex; align-items: center; gap: 6px; }
#tip .tr i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.sankey-band { transition: opacity .15s; cursor: default; }

/* modal, toast */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: grid; place-items: center; padding: 16px; animation: fade .15s ease; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); width: min(640px, 100%); max-height: calc(100dvh - 32px); overflow: auto; padding: 20px; border: 1px solid var(--line); }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.modal-head h2 { flex: 1; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 12px 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-pop); font-weight: 600; font-size: 13px; width: 100%; animation: rise .2s ease; }
.toast .grow { flex: 1; min-width: 0; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; cursor: pointer; text-decoration: underline; padding: 4px; }
.drop { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 26px; text-align: center; background: var(--surface-2); }
.drop.on { border-color: var(--accent); background: var(--accent-soft); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.claude-out { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 13.5px; line-height: 1.6; }
.tasklist .li { align-items: flex-start; }
.tasklist .done-txt { text-decoration: line-through; color: var(--muted); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px 0; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .caret { transition: transform .15s; display: inline-flex; }
details.fold[open] > summary .caret { transform: rotate(90deg); }
.kbd { font-size: 11px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); font-weight: 700; }
.quick { display: grid; grid-template-columns: minmax(0, 2fr) 120px minmax(0, 1.4fr) auto; gap: 8px; align-items: center; }
.hide-sm { }
@keyframes fade { from { opacity: 0 } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } }

/* responsive */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-main { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 6px 2px; border-radius: 8px; cursor: pointer; }
  .tabbar button svg { width: 21px; height: 21px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .payday-cols, .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .only-narrow { display: inline-flex !important; }
}
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .topbar { gap: 10px; }
  .monthsw .label { min-width: 104px; font-size: 14px; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .hero-side { align-items: flex-start; }
  .kpi .val { font-size: 20px; }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-row .track { grid-column: 1 / -1; grid-row: 2; }
  .quick { grid-template-columns: minmax(0, 1fr) 100px; }
  .quick > :nth-child(3) { grid-column: 1 / -1; }
  .quick > :nth-child(4) { grid-column: 1 / -1; }
  .hide-sm { display: none !important; }
  .show-sm { display: block; }
  table.ledger tr.note-row { display: table-row; }
  table.ledger tr.note-row td { padding-top: 0; }
  table.ledger tr.has-note td { border-bottom: 0; }
  .panel { padding: 14px; }
  .pot-facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pay-input { grid-template-columns: minmax(0, 1fr); align-items: stretch; }
  .pay-side { align-items: flex-start; }
  .pay-note { text-align: left; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>window.TP_APP = {"version": "1.0.0", "released": "2026-10-05"};</script>
<script>
/* ===== Engine: pure money logic (no DOM) ===== */
const ENGINE = (() => {
  const EPS = 0.005;
  const r2 = x => Math.round(((+x || 0) + Number.EPSILON) * 100) / 100;
  const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const live = obj => Object.entries(obj || {})
    .filter(([, v]) => isObj(v) && !v.deleted)
    .map(([id, v]) => Object.assign({}, v, { id }));
  const byOrder = (a, b) => ((a.order ?? 999) - (b.order ?? 999)) || String(a.name || a.label || a.id).localeCompare(String(b.name || b.label || b.id));

  /* ---------- dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const monthOf = ds => String(ds || '').slice(0, 7);
  function addMonths(key, n) {
    let [y, m] = key.split('-').map(Number);
    m += n;
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return `${y}-${pad(m)}`;
  }
  function monthDiff(a, b) {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb - ya) * 12 + (mb - ma);
  }
  function daysInMonth(key) { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
  const ds = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const dow = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
  function lastWorkingDay(key) {
    const [y, m] = key.split('-').map(Number);
    let d = daysInMonth(key);
    while ([0, 6].includes(new Date(y, m - 1, d).getDay())) d--;
    return ds(y, m, d);
  }
  function workingDayOnOrBefore(key, day) {
    const [y, m] = key.split('-').map(Number);
    let d = Math.min(Math.max(1, day | 0), daysInMonth(key));
    while (d > 1 && [0, 6].includes(new Date(y, m - 1, d).getDay())) d--;
    return ds(y, m, d);
  }
  function paydayFor(member, key) {
    const r = (member && member.payRule) || {};
    const k = r.fundsNextMonth ? addMonths(key, -1) : key;
    if (r.type === 'lastWorkingDay') return lastWorkingDay(k);
    if (r.type === 'dayOfMonth') return workingDayOnOrBefore(k, r.day || 1);
    return null;
  }
  function transferDate(member, key) {
    const d = Math.min(Math.max(1, (member && member.transferDay) || 1), daysInMonth(key));
    const [y, m] = key.split('-').map(Number);
    return ds(y, m, d);
  }

  /* ---------- plan accessors ---------- */
  const members = plan => live(plan && plan.members).sort(byOrder);
  const categories = plan => live(plan && plan.categories).sort(byOrder);
  const pots = plan => live(plan && plan.pots).sort((a, b) => (a.priority ?? 99) - (b.priority ?? 99) || byOrder(a, b));
  const accounts = plan => live(plan && plan.accounts).sort(byOrder);
  const debts = plan => live(plan && plan.debts).sort(byOrder);
  const planLines = plan => live(plan && plan.lines).sort(byOrder);
  const rules = plan => live(plan && plan.rules);
  const trips = plan => live(plan && plan.trips).sort(byOrder);
  const txnsOf = month => live(month && month.txns).sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  /* ---------- calculators ---------- */
  function sdlt(price) { // home-mover residential bands (from 1 Apr 2025)
    const p = Math.max(0, +price || 0);
    const band = (lo, hi, rate) => Math.max(0, Math.min(p, hi) - lo) * rate;
    return r2(band(125000, 250000, 0.02) + band(250000, 925000, 0.05) + band(925000, 1500000, 0.10) + band(1500000, Infinity, 0.12));
  }
  function pmt(rateMonthly, n, pv) {
    if (!n) return 0;
    if (!rateMonthly) return pv / n;
    return pv * rateMonthly / (1 - Math.pow(1 + rateMonthly, -n));
  }
  function fx(plan, cur) { const v = plan && plan.calc && plan.calc.fx && plan.calc.fx[cur]; return +v || (cur === 'LKR' ? 450 : 1); }
  function vehicleCalc(plan) {
    const c = (plan.calc && plan.calc.slVehicle) || {};
    const price = +c.priceLKR || 0, ltv = Math.min(1, Math.max(0, +c.ltv || 0));
    const upfrontLKR = price * (1 - ltv);
    const loanLKR = price * ltv;
    const monthlyLKR = pmt((+c.rate || 0) / 12, +c.term || 60, loanLKR);
    const rate = fx(plan, 'LKR');
    return { price, ltv, upfrontLKR, loanLKR, monthlyLKR, upfrontGBP: r2(upfrontLKR / rate), monthlyGBP: r2(monthlyLKR / rate), term: +c.term || 60, rate: +c.rate || 0 };
  }
  function houseCalc(plan) {
    const h = (plan.calc && plan.calc.house) || {};
    const gross = sum(members(plan), m => m.grossPay);
    const price = +h.price || 0;
    const mortgage = gross * (+h.multiple || 4.5);
    const deposit = Math.max(0, price - mortgage);
    const duty = sdlt(price);
    const fees = +h.fees || 0;
    const cash = deposit + duty + fees;
    const equity = +h.equity || 0;
    return { price, gross, mortgage: r2(mortgage), deposit: r2(deposit), duty, fees, cash: r2(cash), equity, toSave: r2(Math.max(0, cash - equity)), multiple: +h.multiple || 4.5 };
  }
  function weddingCalc(plan, fromKey) {
    const w = (plan.calc && plan.calc.wedding) || {};
    const target = +w.target || 0;
    const months = w.date ? Math.max(1, monthDiff(fromKey, String(w.date).slice(0, 7))) : null;
    return { target, date: w.date || null, months };
  }
  function potTarget(plan, pot) {
    if (!pot) return 0;
    if (pot.targetFrom === 'slVehicle') return vehicleCalc(plan).upfrontGBP;
    if (pot.targetFrom === 'house') return houseCalc(plan).toSave;
    if (pot.targetFrom === 'wedding') return +((plan.calc && plan.calc.wedding && plan.calc.wedding.target) || 0);
    return +pot.target || 0;
  }

  /* ---------- category helpers ---------- */
  function catMap(plan) { const m = {}; categories(plan).forEach(c => m[c.id] = c); return m; }
  function accountMap(plan) { const m = {}; accounts(plan).forEach(a => m[a.id] = a); return m; }
  function potMap(plan) { const m = {}; pots(plan).forEach(p => m[p.id] = p); return m; }
  function debtMap(plan) { const m = {}; debts(plan).forEach(d => m[d.id] = d); return m; }
  // virtual categories: pot:<id>:in, pot:<id>:out, debt:<id>, xfer:joint, xfer:own, income
  function parseCat(id) {
    if (!id) return { type: 'none' };
    if (id.startsWith('pot:')) { const [, pot, dir] = id.split(':'); return { type: dir === 'out' ? 'potOut' : 'potIn', pot }; }
    if (id.startsWith('debt:')) return { type: 'debt', debt: id.slice(5) };
    if (id === 'xfer:own') return { type: 'xferOwn' };
    if (id.startsWith('xfer:')) return { type: 'xferJoint', pool: id.slice(5) };
    if (id === 'income') return { type: 'income' };
    return { type: 'cat', cat: id };
  }

  /* ---------- shared pools ---------- */
  // The joint account (settings in plan.joint) plus any other shared pot in plan.pools, such as a grocery pot.
  // A budget belongs to a pool when its payer is the pool's id. Each pool is split between the pays its own way,
  // and each person gets one transfer line per pool on their payday.
  function pools(plan) {
    const j = plan.joint || {};
    const jointAcc = j.account || ((accounts(plan).find(a => a.owner === 'joint' && a.type === 'current') || {}).id) || null;
    const base = Object.assign({ name: 'Joint account', method: 'proportional', order: 0 }, j, { id: 'joint', account: jointAcc });
    const rest = live(plan.pools).filter(p => p.id !== 'joint')
      .map(p => Object.assign({ method: base.method === 'remainder' ? 'proportional' : base.method, order: 50 }, p)).sort(byOrder);
    return [base].concat(rest);
  }
  function poolMap(plan) { const m = {}; pools(plan).forEach(p => m[p.id] = p); return m; }
  function poolTotal(plan, poolId, extraByCat = {}) {
    return r2(sum(categories(plan).filter(c => c.payer === poolId), c => (+c.budget || 0) + (extraByCat[c.id] || 0)));
  }
  function jointTotal(plan, extraByCat = {}) { return r2(sum(pools(plan), p => poolTotal(plan, p.id, extraByCat))); }
  function ownPlanned(plan, memberId) {
    return r2(sum(categories(plan).filter(c => c.payer === memberId), c => +c.budget || 0));
  }
  function linesPlanned(plan, memberId) {
    return r2(sum(planLines(plan).filter(l => l.member === memberId), l => +l.amount || 0));
  }
  function splitPool(plan, pool, J, ms, taken) {
    const shares = {};
    const pay = m => +m.plannedPay || 0;
    // the last person takes the rounding penny, so shares always add up to the pool exactly
    const fillLast = (list, total) => { if (!list.length) return; const last = list[list.length - 1]; shares[last.id] = r2(total - sum(list.slice(0, -1), m => shares[m.id])); };
    const method = pool.method || 'proportional';
    if (method === 'remainder' && ms.find(m => m.id === pool.remainderMember)) {
      const r = ms.find(m => m.id === pool.remainderMember);
      const rs = Math.max(0, pay(r) - ownPlanned(plan, r.id) - linesPlanned(plan, r.id) - (taken[r.id] || 0));
      shares[r.id] = r2(Math.min(rs, J));
      const others = ms.filter(m => m.id !== r.id);
      const rest = r2(Math.max(0, J - shares[r.id]));
      const tot = sum(others, pay) || others.length;
      others.forEach(m => shares[m.id] = r2(rest * ((sum([m], pay) || 1) / tot)));
      fillLast(others, rest);
    } else if (method === 'equal') {
      ms.forEach(m => shares[m.id] = r2(J / (ms.length || 1)));
      fillLast(ms, J);
    } else if (method === 'fixed') {
      ms.forEach(m => shares[m.id] = r2(+(pool.fixed && pool.fixed[m.id]) || 0));
    } else {
      const tot = sum(ms, pay);
      ms.forEach(m => shares[m.id] = r2(tot > 0 ? J * pay(m) / tot : J / (ms.length || 1)));
      fillLast(ms, J);
    }
    return shares;
  }
  function plannedShares(plan, extraByCat) {
    const ms = members(plan);
    const ps = pools(plan);
    const byPool = {}, shares = {}, taken = {};
    ms.forEach(m => { shares[m.id] = 0; taken[m.id] = 0; });
    // pools with a fixed rule first, so a "pays what's left" share knows what the other pools already take
    const order = ps.filter(p => p.method !== 'remainder').concat(ps.filter(p => p.method === 'remainder'));
    for (const p of order) {
      const J = poolTotal(plan, p.id, extraByCat);
      const sh = splitPool(plan, p, J, ms, taken);
      byPool[p.id] = { J, shares: sh };
      ms.forEach(m => { taken[m.id] = r2(taken[m.id] + (sh[m.id] || 0)); shares[m.id] = r2(shares[m.id] + (sh[m.id] || 0)); });
    }
    return { J: r2(sum(ps, p => byPool[p.id].J)), shares, byPool };
  }

  /* ---------- ledger: pot & debt balances through time ---------- */
  function ledger(plan, months) {
    const keys = Object.keys(months || {}).filter(k => /^\d{4}-\d{2}$/.test(k)).sort();
    const ps = pots(plan), dsList = debts(plan), acc = accountMap(plan);
    const bal = {}; ps.forEach(p => bal[p.id] = +p.opening || 0);
    const debtBal = {}; dsList.forEach(d => debtBal[d.id] = d.startBalance == null ? null : +d.startBalance);
    const startOf = {}, debtStartOf = {}, flows = {};
    for (const k of keys) {
      startOf[k] = Object.assign({}, bal);
      debtStartOf[k] = Object.assign({}, debtBal);
      const m = months[k];
      const f = { potIn: {}, debtPay: {}, debtCharge: {} };
      const add = (o, id, v) => { o[id] = r2((o[id] || 0) + v); };
      for (const t of txnsOf(m)) {
        const p = parseCat(t.category), amt = +t.amount || 0;
        if (p.type === 'potIn') add(f.potIn, p.pot, amt);
        else if (p.type === 'potOut') add(f.potIn, p.pot, -amt);
        else if (p.type === 'debt') add(f.debtPay, p.debt, amt);
        const a = acc[t.account];
        if (a && a.debt && !['debt', 'income', 'xferOwn'].includes(p.type)) {
          const d = (plan.debts || {})[a.debt];
          if (d && (!d.asOf || String(t.date) > String(d.asOf))) add(f.debtCharge, a.debt, amt);
        }
      }
      // A tick records a transfer nobody logged yet. If the same transfer is logged later as a transaction, the tick
      // must not count it a second time: anything logged since the tick comes off the tick.
      const logged = {};
      for (const t of txnsOf(m)) {
        const p = parseCat(t.category);
        if (p.type === 'potIn') add(logged, t.member + '|pot:' + p.pot, +t.amount || 0);
        else if (p.type === 'debt') add(logged, t.member + '|debt:' + p.debt, +t.amount || 0);
      }
      for (const [tkKey, tk] of Object.entries(m.ticks || {})) {
        if (!isObj(tk) || tk.deleted || !tk.done) continue;
        const mem = tkKey.split(':')[0];
        let amt = +tk.amount || 0;
        if (tk.coveredAt != null) {
          const lg = tk.pot ? (logged[mem + '|pot:' + tk.pot] || 0) : tk.debt ? (logged[mem + '|debt:' + tk.debt] || 0) : 0;
          amt = Math.max(0, amt - Math.max(0, lg - (+tk.coveredAt || 0)));
        }
        if (tk.pot) add(f.potIn, tk.pot, amt);
        if (tk.debt) add(f.debtPay, tk.debt, amt);
      }
      for (const mv of live(m.potMoves)) add(f.potIn, mv.pot, +mv.amount || 0);
      for (const [pid, v] of Object.entries(f.potIn)) bal[pid] = r2((bal[pid] || 0) + v);
      for (const d of dsList) {
        if (debtBal[d.id] == null) { if (f.debtPay[d.id] || f.debtCharge[d.id]) debtBal[d.id] = null; continue; }
        debtBal[d.id] = r2(debtBal[d.id] + (f.debtCharge[d.id] || 0) - (f.debtPay[d.id] || 0));
      }
      flows[k] = f;
    }
    return { keys, startOf, debtStartOf, flows, end: bal, debtEnd: debtBal };
  }
  function balancesAtStart(plan, months, L, key) {
    if (L.startOf[key]) return L.startOf[key];
    const prior = L.keys.filter(k => k < key);
    if (!prior.length) { const b = {}; pots(plan).forEach(p => b[p.id] = +p.opening || 0); return b; }
    // balance after last prior month
    const last = prior[prior.length - 1];
    const b = Object.assign({}, L.startOf[last]);
    for (const [pid, v] of Object.entries(L.flows[last].potIn)) b[pid] = r2((b[pid] || 0) + v);
    return b;
  }
  function balancesAtEnd(plan, months, L, key) {
    const b = Object.assign({}, balancesAtStart(plan, months, L, key));
    if (L.flows[key]) for (const [pid, v] of Object.entries(L.flows[key].potIn)) b[pid] = r2((b[pid] || 0) + v);
    return b;
  }

  /* ---------- pot completion & cascade ---------- */
  function isComplete(plan, pot, bal) {
    if (!pot) return false;
    if (pot.status === 'done') return true;
    const t = potTarget(plan, pot);
    return t > 0 && (bal[pot.id] || 0) >= t - EPS;
  }
  function cascadeTarget(plan, potId, bal) {
    const pm = potMap(plan);
    let p = pm[potId];
    const seen = new Set();
    while (p && isComplete(plan, p, bal) && !seen.has(p.id)) {
      seen.add(p.id);
      const next = pots(plan).find(q => q.id !== p.id && !seen.has(q.id) && (q.priority ?? 99) > (p.priority ?? 99) && potTarget(plan, q) > 0 && !isComplete(plan, q, bal));
      if (!next) { const fb = (plan.settings && plan.settings.cascadeFallback) || null; return fb && pm[fb] ? fb : p.id; }
      p = next;
    }
    return p ? p.id : potId;
  }
  function firstUnfinished(plan, bal) {
    const p = pots(plan).find(q => potTarget(plan, q) > 0 && !isComplete(plan, q, bal));
    return p ? p.id : ((plan.settings && plan.settings.cascadeFallback) || null);
  }

  /* ---------- month computation ---------- */
  const GROUPS = ['joint', 'own', 'savings', 'srilanka', 'debt', 'buffer'];
  function lineGroup(plan, line) {
    if (line.kind === 'joint' || line.kind === 'cover') return 'joint';
    if (line.kind === 'debt') return 'debt';
    if (line.kind === 'buffer') return line.pot ? (((plan.pots || {})[line.pot] || {}).group === 'srilanka' ? 'srilanka' : 'savings') : 'buffer';
    if (line.kind === 'support') return 'srilanka';
    if (line.kind === 'pot') return ((plan.pots || {})[line.pot] || {}).group === 'srilanka' ? 'srilanka' : 'savings';
    return 'own';
  }

  function computeMonth(plan, months, key, Lopt) {
    const L = Lopt || ledger(plan, months);
    const m = (months && months[key]) || {};
    const ms = members(plan);
    const pm = potMap(plan), cm = catMap(plan), am = accountMap(plan), dm = debtMap(plan);
    const startBal = balancesAtStart(plan, months, L, key);
    const txns = txnsOf(m);

    // running costs from completed pots (e.g. car)
    const runAdd = {};
    for (const p of pots(plan)) {
      if (p.runningCost > 0 && p.runningCategory && isComplete(plan, p, startBal)) runAdd[p.runningCategory] = (runAdd[p.runningCategory] || 0) + (+p.runningCost);
    }
    const moves = live(m.budgetMoves);
    const sweeps = live(m.potMoves).filter(x => x.fromCategory);
    // category budgets & spend
    const cats = categories(plan).map(c => {
      const base = (m.catBudgets && m.catBudgets[c.id] != null && m.catBudgets[c.id] !== '') ? +m.catBudgets[c.id] : (+c.budget || 0);
      const extra = runAdd[c.id] || 0;
      const movedIn = sum(moves.filter(x => x.to === c.id), x => x.amount);
      const movedOut = sum(moves.filter(x => x.from === c.id), x => x.amount);
      const swept = sum(sweeps.filter(x => x.fromCategory === c.id), x => x.amount);
      const budget = r2(base + extra + movedIn - movedOut - swept);
      const tx = txns.filter(t => t.category === c.id);
      const spent = r2(sum(tx, t => t.amount));
      return Object.assign({}, c, { base, extra, movedIn: r2(movedIn), movedOut: r2(movedOut), swept: r2(swept), budget, spent, left: r2(budget - spent), count: tx.length });
    });
    const catById = {}; cats.forEach(c => catById[c.id] = c);

    // shared pools: the joint account and any other shared pot, each with its own split
    const PS = pools(plan);
    const { byPool } = plannedShares(plan, runAdd);
    const Jp = {}, poolCats = {};
    PS.forEach(p => {
      const pc = cats.filter(c => c.payer === p.id);
      Jp[p.id] = r2(sum(pc, c => c.base + c.extra));
      poolCats[p.id] = new Set(pc.map(c => c.id));
    });
    const J = r2(sum(PS, p => Jp[p.id]));
    const isSharedAcc = acc => !!(am[acc] && am[acc].owner === 'joint');
    const poolLineId = (pid, mid) => (pid === 'joint' ? 'joint:' : pid + ':') + mid;
    const coverLineId = (pid, mid) => (pid === 'joint' ? 'cover:' : 'cover:' + pid + ':') + mid;

    const ov = m.lines || {};
    const ticks = m.ticks || {};
    const res = {};
    const potLinesFor = memberId => {
      const out = [];
      const base = planLines(plan).filter(l => l.member === memberId && !(ov[l.id] && ov[l.id].deleted));
      for (const l of base) {
        const o = ov[l.id] || {};
        const amount = o.amount != null ? +o.amount : (+l.amount || 0);
        const kind = l.kind || 'pot';
        if (kind === 'pot') {
          const chosen = o.pot || l.pot;
          const p = pm[chosen];
          let target = cascadeTarget(plan, chosen, startBal);
          let runningSplit = 0;
          if (p && p.runningCost > 0 && isComplete(plan, p, startBal)) runningSplit = Math.min(amount, +p.runningCost);
          out.push({ id: l.id, planId: l.id, kind: 'pot', pot: target, origPot: chosen, cascaded: target !== chosen ? chosen : null, redirected: o.pot && o.pot !== l.pot ? l.pot : null, amount: r2(amount - runningSplit), planned: +l.amount || 0, overridden: o.amount != null || !!o.pot, note: o.note || l.note || '' });
        } else if (kind === 'debt') {
          out.push({ id: l.id, planId: l.id, kind: 'debt', debt: l.debt, amount: r2(amount), planned: +l.amount || 0, overridden: o.amount != null, note: o.note || l.note || '' });
        }
      }
      return out;
    };

    for (const mem of ms) {
      const pay = m.pay && m.pay[mem.id];
      const received = pay && pay.amount != null && pay.amount !== '';
      const income = received ? +pay.amount : (+mem.plannedPay || 0);
      const lines = [];
      // one transfer line per shared pool
      for (const p of PS) {
        const lid = poolLineId(p.id, mem.id);
        const lo = ov[lid] || {};
        const base = r2((byPool[p.id] && byPool[p.id].shares[mem.id]) || 0);
        lines.push({ id: lid, kind: 'joint', pool: p.id, amount: r2(lo.amount != null ? +lo.amount : base), planned: base, overridden: lo.amount != null, note: lo.note || '' });
      }
      // own categories
      for (const c of cats.filter(c => c.payer === mem.id)) {
        const budget = r2(c.base + c.extra);
        if (budget <= 0 && !c.count) continue;
        const catOv = m.catBudgets && m.catBudgets[c.id] != null && m.catBudgets[c.id] !== '';
        lines.push({ id: 'cat:' + c.id, kind: c.kind === 'support' ? 'support' : 'own', category: c.id, amount: budget, planned: +c.budget || 0, overridden: !!catOv, note: c.extra ? 'Includes £' + c.extra + ' running costs' : '' });
      }
      // pot lines
      lines.push(...potLinesFor(mem.id));
      // extras
      for (const x of live(m.extra).filter(x => x.member === mem.id)) {
        const xo = { id: x.id, kind: x.kind || 'other', amount: r2(+x.amount || 0), planned: 0, overridden: false, extra: true, label: x.label, note: x.note || '' };
        if (x.kind === 'pot') { xo.pot = cascadeTarget(plan, x.pot, startBal); xo.origPot = x.pot; }
        if (x.kind === 'debt') xo.debt = x.debt;
        if (x.kind === 'own' || x.kind === 'support') xo.category = x.category;
        lines.push(xo);
      }
      // "Pays what's left" split: the share is what this pay leaves after everything else this person pays this month,
      // never more than the planned share. A short or part-month pay shrinks the shared transfer (the backstop covers
      // the gap) instead of cutting their savings, and an Undo lands on a figure the pay can actually fund.
      for (const p of PS) {
        if (p.method !== 'remainder' || p.remainderMember !== mem.id) continue;
        const jl = lines.find(l => l.kind === 'joint' && l.pool === p.id);
        if (!jl || jl.overridden) continue;
        const others = r2(sum(lines.filter(l => l !== jl), l => l.amount));
        const fit = r2(Math.min(jl.planned, Math.max(0, income - others)));
        if (fit < jl.planned - EPS) { jl.amount = fit; if (!jl.note) jl.note = 'Less this month: what this pay leaves after the lines below'; }
      }
      res[mem.id] = { member: mem, income, received: !!received, payDate: received ? pay.date : paydayFor(mem, key), payNote: pay && pay.note, lines };
    }

    // what has already been moved or spent against each line. Measured before any cuts, because a cut must never
    // undo money that has already gone across.
    const mineOf = {};
    ms.forEach(mem => { mineOf[mem.id] = txns.filter(t => t.member === mem.id); });
    function measure(memId, l) {
      const mine = mineOf[memId] || [];
      const tk = ticks[memId + ':' + l.id];
      const rawTick = tk && tk.done && !tk.deleted ? (+tk.amount || 0) : 0;
      let covered = 0;
      if (l.kind === 'joint') {
        // money put into this pool from the person's own accounts: transfers in, and pool budgets paid from their own card
        const pc = poolCats[l.pool] || new Set();
        covered = sum(mine.filter(t => (pc.has(t.category) && !isSharedAcc(t.account)) || t.category === 'xfer:' + l.pool), t => t.amount);
      } else if (l.kind === 'pot') {
        covered = sum(mine.filter(t => t.category === 'pot:' + l.pot + ':in'), t => t.amount);
      } else if (l.kind === 'debt') {
        covered = sum(mine.filter(t => t.category === 'debt:' + l.debt), t => t.amount);
      } else if ((l.kind === 'own' || l.kind === 'support') && l.category) {
        covered = catById[l.category] ? catById[l.category].spent : 0;
      }
      l.covered = r2(covered);
      l.tick = tk && !tk.deleted ? tk : null;
      // transactions logged after the tick replace it rather than add to it
      const since = tk && tk.coveredAt != null ? Math.max(0, covered - (+tk.coveredAt || 0)) : 0;
      l.ticked = r2(Math.max(0, rawTick - since));
    }
    ms.forEach(mem => res[mem.id].lines.forEach(l => measure(mem.id, l)));

    // income shortfall cuts: lowest-priority pots first, shared transfers last, and never below what has already moved
    const cutOrder = l => {
      if (l.kind === 'pot') { const p = pm[l.pot]; return 100 - ((p && p.priority) ?? 99); }
      if (l.kind === 'joint') return 500;
      return null; // never cut
    };
    function applyCuts(r) {
      r.lines.forEach(l => { l.cut = 0; l.final = l.amount; });
      let need = r2(sum(r.lines, l => l.final) - r.income);
      if (need > EPS) {
        const cuttable = r.lines.filter(l => cutOrder(l) != null && l.final > 0).sort((a, b) => cutOrder(a) - cutOrder(b));
        for (const l of cuttable) {
          if (need <= EPS) break;
          const room = r2(Math.max(0, l.final - (l.covered || 0) - (l.ticked || 0)));
          const c = r2(Math.min(room, need));
          if (c <= EPS) continue;
          l.cut = r2(l.cut + c); l.final = r2(l.final - c); need = r2(need - c);
        }
      }
      r.unfunded = need > EPS ? need : 0;
    }
    ms.forEach(mem => applyCuts(res[mem.id]));

    const defaultBackstop = (plan.joint && plan.joint.backstop) || (ms[ms.length - 1] && ms[ms.length - 1].id);
    const backstopOf = p => (p.backstop && res[p.backstop] ? p.backstop : defaultBackstop);
    const unpaid = l => r2(Math.max(0, l.final - l.covered - l.ticked));
    const shift = (l, x, note) => { l.amount = r2(l.amount + x); l.final = r2(l.final + x); l.swapped = r2((l.swapped || 0) + x); if (!l.note) l.note = note; };
    // Extra put into one pool is swapped between pools with the backstop: if one person puts more than their share
    // into, say, the grocery pot, the backstop puts that much less into it and the person moves that much less to the
    // joint account. Both pools stay exactly funded and nobody pays twice.
    for (const p of PS) {
      const bid = backstopOf(p);
      const bl = res[bid] && res[bid].lines.find(l => l.kind === 'joint' && l.pool === p.id);
      if (!bl) continue;
      for (const mem of ms) {
        if (mem.id === bid) continue;
        const r = res[mem.id];
        const jl = r.lines.find(l => l.kind === 'joint' && l.pool === p.id);
        if (!jl) continue;
        const extra = r2(jl.covered + jl.ticked - jl.final);
        const others = r.lines.filter(l => l.kind === 'joint' && l.pool !== p.id);
        const x = r2(Math.min(extra, unpaid(bl), sum(others, unpaid)));
        if (x <= EPS) continue;
        const pName = String(p.name || 'pool'), who = mem.label || 'They';
        shift(jl, x, `Includes ${'£' + x.toFixed(2)} extra put in, so that much less goes elsewhere`);
        shift(bl, -x, `${'£' + x.toFixed(2)} less: ${who} put more than their share into the ${pName.toLowerCase()}`);
        let rem = x;
        for (const ol of others) {
          const t = r2(Math.min(unpaid(ol), rem));
          if (t > EPS) { shift(ol, -t, `${'£' + t.toFixed(2)} less: that much extra went into the ${pName.toLowerCase()}`); rem = r2(rem - t); }
          if (rem <= EPS) break;
        }
      }
    }
    // Extra that can't be swapped (their other shared transfers are already made) comes off the backstop's share of
    // the same pool. The person who put it in then has that much less for everything else, so their pay is re-checked
    // and any shortfall shows on their payday instead of hiding.
    const touched = new Set();
    for (const p of PS) {
      const bid = backstopOf(p);
      const bl = res[bid] && res[bid].lines.find(l => l.kind === 'joint' && l.pool === p.id);
      if (!bl) continue;
      for (const mem of ms) {
        if (mem.id === bid) continue;
        const jl = res[mem.id].lines.find(l => l.kind === 'joint' && l.pool === p.id);
        if (!jl) continue;
        const x = r2(Math.min(r2(jl.covered + jl.ticked - jl.final), unpaid(bl)));
        if (x <= EPS) continue;
        const pName = String(p.name || 'pool'), who = mem.label || 'They';
        shift(jl, x, `Includes ${'£' + x.toFixed(2)} extra put in`);
        shift(bl, -x, `${'£' + x.toFixed(2)} less: ${who} put more than their share into the ${pName.toLowerCase()}`);
        touched.add(mem.id); touched.add(bid);
      }
    }
    touched.forEach(id => applyCuts(res[id]));

    // cover: whatever a pool is still missing falls to that pool's backstop
    const poolProvided = pid => r2(sum(ms, mem => sum(res[mem.id].lines.filter(l => (l.kind === 'joint' || l.kind === 'cover') && l.pool === pid), l => l.final)));
